<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amigo invisible en familia</title>

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#0f2e22; --bg2:#164233; --bg3:#1d5340;
  --cream:#fff8ec; --cream2:#f6ead3; --ink:#3a1410; --ink2:#7a4a3a;
  --red:#c0392b; --red2:#9e2a1f; --gold:#e9b44c; --gold2:#ffd666; --green:#2e8b57;
  --r:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:Nunito,system-ui,sans-serif;font-size:16px;min-height:100%}
body{padding:calc(var(--safe-t) + 8px) 0 calc(var(--safe-b) + 110px)}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,.xmas{font-family:'Mountains of Christmas',Georgia,serif;font-weight:700;letter-spacing:.5px}
h1{font-size:40px;margin:6px 0 0;color:var(--gold2);text-align:center;line-height:1.05}
h2{font-size:30px;margin:0;color:var(--gold2)}
.sub{color:#cfe3d6;text-align:center;margin:4px 0 18px;font-size:15px}
.top{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.top h2{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:transparent;color:var(--gold2);font-size:20px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.card{background:var(--cream);color:var(--ink);border-radius:var(--r);padding:16px;margin-bottom:14px;position:relative}
.card.ribbon{overflow:hidden}
.card.ribbon:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(45deg,var(--red) 0 10px,#fff 10px 20px)}
.sorteo-card{display:flex;align-items:center;gap:14px;cursor:pointer;padding-left:24px}
.sorteo-card .big{font-family:'Mountains of Christmas',serif;font-size:28px;color:var(--red2);line-height:1}
.sorteo-card .meta{font-size:14px;color:var(--ink2);margin-top:4px}
.sorteo-card .arrow{margin-left:auto;font-size:26px;color:var(--red)}
.badge{display:inline-block;background:var(--cream2);color:var(--ink2);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;margin:4px 6px 0 0}
.badge.ok{background:#d9f0e2;color:#1b5e3a}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font:800 16px Nunito,sans-serif;cursor:pointer;background:var(--cream2);color:var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.gold{background:var(--gold);color:#3a2404}
.btn.ghost{background:transparent;color:var(--gold2);border:2px dashed var(--gold)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 16px);z-index:20;width:min(528px,calc(100% - 32px));font-size:20px;padding:16px;border-radius:18px;box-shadow:0 6px 0 var(--red2),0 10px 30px rgba(0,0,0,.4);font-family:'Mountains of Christmas',serif}
.fab:active{transform:translateX(-50%) translateY(3px);box-shadow:0 3px 0 var(--red2)}
.tabs{display:flex;background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:14px;gap:4px}
.tabs button{flex:1;border:0;background:transparent;color:#cfe3d6;font:800 14px Nunito,sans-serif;padding:10px 4px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--gold);color:#3a2404}
label{display:block;font-weight:800;font-size:14px;margin:10px 0 4px;color:var(--ink2)}
input,textarea,select{width:100%;border:2px solid #e4d3b4;background:#fff;border-radius:12px;padding:11px 12px;font:16px Nunito,sans-serif;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{min-height:200px;resize:vertical;line-height:1.45}
.row2{display:flex;gap:10px}.row2>*{flex:1;min-width:0}
.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #e4d3b4}
.person:last-child{border-bottom:0}
.person.off{opacity:.45}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;color:#fff}
.pname{font-weight:800}
.pmail{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinfo{flex:1;min-width:0}
.mini{border:0;background:var(--cream2);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;flex:none}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#d8c7a8;border-radius:99px;transition:.2s}
.switch span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span:before{transform:translateX(18px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:0;background:var(--cream2);color:var(--red2);border-radius:999px;padding:6px 10px;font:800 13px Nunito,sans-serif;cursor:pointer}
.preview{background:#fff;border:2px solid var(--gold);border-radius:14px;padding:14px;white-space:pre-wrap;line-height:1.5;font-size:15px}
.secret{background:var(--red);color:#fff;border-radius:8px;padding:1px 8px;font-weight:800}
.note{font-size:14px;color:var(--ink2);line-height:1.45}
.warn{background:#fff1d6;border:2px solid var(--gold);color:#5a3a06;border-radius:14px;padding:12px;font-size:14px;line-height:1.45;margin-bottom:14px}
.banner{background:var(--red);color:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.empty{text-align:center;padding:16px 6px;color:var(--ink2)}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #e4d3b4}
.hist:last-child{border-bottom:0}
.hist .y{font-family:'Mountains of Christmas',serif;font-size:28px;color:var(--red2);width:70px}
.steps{padding-left:20px;line-height:1.55;font-size:15px}
.steps li{margin-bottom:8px}
code{background:var(--cream2);padding:1px 6px;border-radius:6px;font-size:14px;word-break:break-all}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(5,20,14,.75);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(var(--safe-b) + 16px)}
#modal.show{display:flex}
#modal .card{width:100%;max-width:520px;max-height:85vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translateX(-50%) translateY(-120px);background:var(--cream);color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:800;z-index:70;transition:.3s;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:90%}
#toast.show{transform:translateX(-50%) translateY(0)}
/* Bombo */
.bombo-wrap{display:flex;justify-content:center;margin:8px 0}
.bombo{width:min(300px,78vw);height:auto;overflow:visible}
.cage{transform-origin:150px 140px;animation:spin 9s linear infinite}
.spinning .cage{animation-duration:.7s}
.ball{animation:jiggle 1.4s ease-in-out infinite}
.spinning .ball{animation-duration:.35s}
.crank{transform-origin:150px 140px;animation:spin 9s linear infinite}
.spinning .crank{animation-duration:.7s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes jiggle{50%{transform:translateY(-6px)}}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:50px;margin:10px 0 4px}
.tball{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;position:relative;animation:pop .45s cubic-bezier(.3,1.6,.5,1);box-shadow:inset -5px -6px 0 rgba(0,0,0,.18),inset 4px 4px 0 rgba(255,255,255,.35)}
.tball .ck{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--green);font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tball.fail .ck{color:var(--red)}
@keyframes pop{from{transform:translateY(-120px) scale(.3);opacity:0}}
.status{text-align:center;font-size:18px;font-weight:800;color:var(--gold2);min-height:28px}
.lights{display:flex;justify-content:space-between;margin:0 6px -4px;height:18px}
.lights i{width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;display:block;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.cage,.crank,.ball,.lights i{animation:none!important}}
.footer-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 20px}
.sr{position:absolute;left:-9999px}
.card{padding-top:22px}
.card:after{content:"";position:absolute;left:0;right:0;top:0;height:16px;border-radius:var(--r) var(--r) 0 0;pointer-events:none;
  background:radial-gradient(circle at 17px 5px,#fff 9px,transparent 10px) 0 0/34px 16px repeat-x,radial-gradient(circle at 8px 0,#fff 7px,transparent 8px) 9px 0/47px 14px repeat-x}
#modal .card:after{display:none}
.nube{display:inline-block;font-size:13px;font-weight:800;padding:4px 12px;border-radius:999px;background:var(--bg2);color:#cfe3d6}
.nube.error{background:#5a2a16;color:#ffd666}
.card .nube{background:var(--cream2);color:var(--ink2)}
#ground{position:fixed;left:0;right:0;bottom:0;height:70px;z-index:0;pointer-events:none}
.garland{display:block;width:100%;height:46px;margin-bottom:-6px}
.garland .b{animation:blink 1.6s infinite}
.tball{margin-top:8px}
.tball:before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:8px;margin-left:-7px;background:#e9b44c;border-radius:3px 3px 1px 1px;box-shadow:0 -4px 0 -2px #e9b44c}
.feliz{font-family:'Mountains of Christmas',serif;font-size:38px;color:var(--gold2);text-align:center;margin:6px 0}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>
<svg id="ground" viewBox="0 0 400 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 Q40 18 90 34 T190 30 T290 36 T400 26 V70 H0Z" fill="#e8f1ee" opacity=".16"/><path d="M0 52 Q60 36 120 50 T240 46 T400 44 V70 H0Z" fill="#ffffff" opacity=".22"/></svg>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="card" id="modalBox"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="fileExcel" class="sr" accept=".xlsx,.xls,.csv,.ods">
<input type="file" id="fileBackup" class="sr" accept=".json,application/json">

<script>
'use strict';
/* =========================================================
   DATOS
   ========================================================= */
const LS_KEY = 'amigoInvisible.v1';
const COLORS = ['#c0392b','#2e8b57','#d4962a','#8e44ad','#2c7fb8','#d35400','#16a085','#b03a6b','#5d6d2c','#7b5230'];
const DEFAULT_MSG =
`¡Hola {nombre}! 🎄

Ya se ha hecho el sorteo del amigo invisible ({sorteo}) y te ha tocado hacerle el regalo a...

🎁 {amigo} 🎁

📅 Día: {fecha}
📍 Lugar: {lugar}
💶 Presupuesto: {presupuesto}

¡Shhh! No se lo digas a nadie 🤫`;

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function randHex(n=16){ const a=new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function nuevoSorteo(nombre){
  return { id:uid(), nombre, personas:[],
    evento:{ fecha:'', hora:'', lugar:'', presupuesto:'', asunto:'🎁 Tu amigo invisible · {sorteo}', mensaje:DEFAULT_MSG },
    reglas:{ noRepetirAnterior:true, maxVeces:2, ventana:5 },
    historial:[], salt:randHex() };
}
function seed(){ return { sorteos:[nuevoSorteo('Adultos'), nuevoSorteo('Primos')], rev:0 }; }
function load(){
  try{ const d = JSON.parse(localStorage.getItem(LS_KEY)); if(d && Array.isArray(d.sorteos)){ delete d.emailjs; return d; } }catch(e){}
  return seed();
}
let DB = load();

/* ---------- Conexión con Google (datos en Drive + envío con Gmail) ---------- */
const CONF_KEY = 'amigoInvisible.conexion';
let CONF = (()=>{ try{ return JSON.parse(localStorage.getItem(CONF_KEY)) || {url:'',clave:''}; }catch(e){ return {url:'',clave:''}; } })();
function guardarConf(){ try{ localStorage.setItem(CONF_KEY, JSON.stringify(CONF)); }catch(e){} }
const conectado = () => !!(CONF.url && CONF.clave);
let NUBE = 'off';            // off · cargando · ok · subiendo · error
let nubeCargada = false;     // ¿hemos leído ya los datos de la nube en esta sesión?
let pendiente = false, subirT = null;

async function llamar(accion, extra={}){
  const r = await fetch(CONF.url.trim(), { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({accion, clave:CONF.clave, ...extra}) });
  let j; try{ j = await r.json(); }catch(e){ throw new Error('La dirección de conexión no responde bien. Revisa que termina en /exec y que el acceso es “Cualquier usuario”.'); }
  if(!j.ok) throw new Error(j.error || 'Error');
  return j;
}
function pintarNube(){
  const el = document.getElementById('nube'); if(!el) return;
  const t = { off:'📱 Solo en este móvil', cargando:'☁️ Cargando…', ok:'☁️ Guardado en la nube', subiendo:'☁️ Guardando…', error:'⚠️ Sin conexión: se guardará al volver' }[NUBE];
  el.textContent = t; el.className = 'nube ' + NUBE;
}
function setNube(s){ NUBE = s; pintarNube(); }
async function cargarNube(){
  if(!conectado()) { setNube('off'); return; }
  setNube('cargando');
  try{
    const j = await llamar('leer');
    if(j.datos && Array.isArray(j.datos.sorteos)){
      if(pendiente && (DB.rev||0) > (j.datos.rev||0) && localStorage.getItem('amigoInvisible.sync')===CONF.url){ nubeCargada = true; await subir(); return; }
      DB = j.datos; guardarLocal(); localStorage.setItem('amigoInvisible.sync', CONF.url);
    } else { nubeCargada = true; await subir(); return; } // primera vez: subimos lo que hay en el móvil
    nubeCargada = true; setNube('ok');
    if(!busy && !$('#modal').classList.contains('show') && !document.activeElement?.matches('input,textarea')) render();
  }catch(e){ setNube('error'); console.warn(e); }
}
async function subir(){
  clearTimeout(subirT);
  if(!conectado() || !nubeCargada) return;
  setNube('subiendo');
  try{ await llamar('guardar', {datos:DB}); pendiente=false; localStorage.setItem('amigoInvisible.sync', CONF.url); setNube('ok'); }
  catch(e){ pendiente=true; setNube('error'); console.warn(e); }
}
function guardarLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){} }
function save(){
  DB.rev = Date.now(); guardarLocal();
  if(conectado()){ pendiente = true; clearTimeout(subirT); subirT = setTimeout(subir, 700); setNube('subiendo'); }
}
addEventListener('online', ()=>{ if(pendiente) subir(); else if(!nubeCargada) cargarNube(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible' && conectado() && !busy && !pendiente) cargarNube(); });
const S = id => DB.sorteos.find(s=>s.id===id);

/* Los resultados se guardan codificados: la app los usa para las reglas
   y para reenviar correos, pero nunca los muestra en pantalla. */
function keyBytes(salt){ const out=[]; let h=2166136261; for(let i=0;i<256;i++){ h ^= salt.charCodeAt(i % salt.length) + i; h = Math.imul(h,16777619)>>>0; out.push(h & 255); } return out; }
function enc(obj, salt){ const k=keyBytes(salt); const b=new TextEncoder().encode(JSON.stringify(obj)); let s=''; b.forEach((x,i)=> s += String.fromCharCode(x ^ k[i % k.length])); return btoa(s); }
function dec(str, salt){ try{ const k=keyBytes(salt); const s=atob(str); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i) ^ k[i % k.length]; return JSON.parse(new TextDecoder().decode(b)); }catch(e){ return {}; } }

/* =========================================================
   SORTEO (algoritmo)
   ========================================================= */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* nivel 0: todas las reglas · 1: sin límite de veces · 2: sin reglas de historial */
function resolver(s, anio, nivel){
  const ids = s.personas.filter(p=>p.activo!==false).map(p=>p.id);
  const r = s.reglas;
  const hist = s.historial.filter(h=>h.anio < anio).sort((a,b)=>b.anio-a.anio).map(h=>({anio:h.anio, pares:dec(h.enc, s.salt)}));
  const anterior = hist[0];
  const veces = (g,x) => hist.filter(h => h.anio > anio - r.ventana && h.pares[g]===x).length;
  const opciones = {};
  for(const g of ids){
    opciones[g] = ids.filter(x => x!==g
      && !(nivel<2 && r.noRepetirAnterior && anterior && anterior.pares[g]===x)
      && !(nivel<1 && r.maxVeces>0 && veces(g,x) >= r.maxVeces));
  }
  const res = {}, usado = new Set(); let pasos = 0;
  function bt(pend){
    if(!pend.length) return true;
    if(++pasos > 300000) return false;
    // el que menos opciones tenga primero
    let best=-1, bestN=1e9;
    pend.forEach((g,i)=>{ const n=opciones[g].filter(x=>!usado.has(x)).length; if(n<bestN){bestN=n;best=i;} });
    if(bestN===0) return false;
    const g = pend[best]; const resto = pend.filter((_,i)=>i!==best);
    for(const x of shuffle(opciones[g].filter(x=>!usado.has(x)))){
      res[g]=x; usado.add(x);
      if(bt(resto)) return true;
      usado.delete(x); delete res[g];
    }
    return false;
  }
  return bt(shuffle([...ids])) ? res : null;
}

/* =========================================================
   MENSAJES Y CORREO
   ========================================================= */
function esc(t){ return String(t??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fechaTexto(ev){
  if(!ev.fecha) return 'por decidir';
  const d = new Date(ev.fecha+'T12:00:00');
  let t = d.toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
  if(ev.hora) t += ' a las ' + ev.hora;
  return t;
}
function vars(s, persona, amigo){
  const ev = s.evento;
  return { nombre:persona, amigo, sorteo:s.nombre, fecha:fechaTexto(ev), lugar:ev.lugar||'por decidir', presupuesto: ev.presupuesto ? (/\d$/.test(ev.presupuesto.trim()) ? ev.presupuesto.trim()+' €' : ev.presupuesto) : 'sin límite' };
}
function rellenar(tpl, v){ return tpl.replace(/\{(\w+)\}/g, (m,k)=> k in v ? v[k] : m); }
function htmlCorreo(s, v){
  const cuerpo = esc(s.evento.mensaje).replace(/\{(\w+)\}/g, (m,k)=>{
    if(k==='amigo') return `<span style="display:inline-block;font-size:26px;font-weight:bold;color:#c0392b;padding:4px 0">${esc(v.amigo)}</span>`;
    return k in v ? `<b>${esc(v[k])}</b>` : m;
  }).replace(/\n/g,'<br>');
  return `<div style="background:#0f2e22;padding:24px 12px;font-family:Georgia,'Times New Roman',serif">
<div style="max-width:480px;margin:0 auto;background:#fff8ec;border-radius:18px;overflow:hidden;border:3px solid #e9b44c">
<div style="background:#c0392b;color:#fff;text-align:center;padding:18px 12px;font-size:24px;letter-spacing:1px">🎄 Amigo invisible 🎄<div style="font-size:15px;color:#ffd666;margin-top:4px">${esc(s.nombre)}</div></div>
<div style="padding:22px 20px;color:#3a1410;font-size:17px;line-height:1.6;text-align:center">${cuerpo}</div>
<div style="background:#e9b44c;height:8px"></div></div>

async function enviarCorreo(to, nombre, subject, message, html){
  await llamar('enviar', { to, subject, message, html });
}
async function enviarAPersona(s, pares, giverId){
  const p = s.personas.find(x=>x.id===giverId);
  const a = s.personas.find(x=>x.id===pares[giverId]);
  if(!p || !a) throw new Error('Persona no encontrada');
  const v = vars(s, p.nombre, a.nombre);
  await enviarCorreo(p.email, p.nombre, rellenar(s.evento.asunto||'Tu amigo invisible', v), rellenar(s.evento.mensaje, v), htmlCorreo(s, v));
}

function iniciales(n){ return (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function color(i){ return COLORS[i % COLORS.length]; }
let toastT;
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2600); }
function modal(html){ $('#modalBox').innerHTML = html; $('#modal').classList.add('show'); }
function closeModal(){ $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
function confirmar(titulo, texto, ok='Sí', peligro=false){
  return new Promise(res=>{
    modal(`<h3 style="margin:0 0 8px;font-size:20px">${titulo}</h3><p class="note" style="font-size:15px">${texto}</p>
      <div class="row2" style="margin-top:14px"><button class="btn" id="mNo">Cancelar</button><button class="btn ${peligro?'red':'gold'}" id="mSi">${ok}</button></div>`);
    $('#mNo').onclick=()=>{closeModal();res(false)}; $('#mSi').onclick=()=>{closeModal();res(true)};
  });
}
function pedirTexto(titulo, valor=''){
  return new Promise(res=>{
    modal(`<h3 style="margin:0 0 8px;font-size:20px">${titulo}</h3><input id="mTxt" value="${esc(valor)}">
      <div class="row2" style="margin-top:14px"><button class="btn" id="mNo">Cancelar</button><button class="btn gold" id="mSi">Guardar</button></div>`);
    const i=$('#mTxt'); setTimeout(()=>i.focus(),50);
    $('#mNo').onclick=()=>{closeModal();res(null)};
    $('#mSi').onclick=()=>{closeModal();res(i.value.trim()||null)};
    i.onkeydown=e=>{ if(e.key==='Enter') $('#mSi').click(); };
  });
}

function lucesHTML(){
  const c=['#ff5a4a','#ffd666','#4fd18b','#6cb7ff']; let bulbs='';
  for(let i=0;i<15;i++){ const x=14+i*26.6, seg=(x%133)/133, y=8+Math.sin(seg*Math.PI)*16; bulbs+=`<g transform="translate(${x.toFixed(1)} ${(y+4).toFixed(1)})"><rect x="-3" y="-3" width="6" height="5" rx="1" fill="#5d6d2c"/><ellipse class="b" cx="0" cy="8" rx="5" ry="7.5" fill="${c[i%4]}" style="animation-delay:${(i%4)*.4}s"/><ellipse cx="-1.6" cy="5.5" rx="1.4" ry="2.4" fill="#fff" opacity=".6"/></g>`; }
  return `<svg class="garland" viewBox="0 0 400 46" preserveAspectRatio="none" aria-hidden="true"><path d="M0 8 Q66 40 133 8 T266 8 T400 8" fill="none" stroke="#2e8b57" stroke-width="5" stroke-linecap="round"/><path d="M0 8 Q66 40 133 8 T266 8 T400 8" fill="none" stroke="#1d5340" stroke-width="2" stroke-dasharray="3 5"/>${bulbs}</svg>`;
}

const emailValido = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
function anadirPersona(){
  const s=S(VIEW.id), n=$('#nNombre').value.trim(), e=$('#nEmail').value.trim();

  if(!emailValido(e)) return toast('Ese correo no parece válido');
  s.personas.push({id:uid(), nombre:n, email:e, activo:true}); save(); render();
  toast(`${n} añadido/a 🎄`); setTimeout(()=>$('#nNombre')?.focus(),50);
}
function togglePersona(id, on){ const p=S(VIEW.id).personas.find(x=>x.id===id); p.activo=on; save(); render(); }

function insertar(t){ const ta=$('#evM'); const a=ta.selectionStart??ta.value.length, b=ta.selectionEnd??a; ta.value=ta.value.slice(0,a)+t+ta.value.slice(b); ta.focus(); ta.selectionStart=ta.selectionEnd=a+t.length; guardarEvento(); }
function guardarEvento(){
  const s=S(VIEW.id), ev=s.evento;
  ev.fecha=$('#evF').value; ev.hora=$('#evH').value; ev.lugar=$('#evL').value; ev.presupuesto=$('#evP').value; ev.asunto=$('#evA').value; ev.mensaje=$('#evM').value;
  save(); previsualizar();
}

function reenviar(anio){
  const s=S(VIEW.id), h=s.historial.find(x=>x.anio==anio), pares=dec(h.enc,s.salt);
  const ids=Object.keys(pares);
  modal(`<h3 style="margin:0 0 4px;font-size:20px">Reenviar correo · ${anio}</h3>
    <p class="note">Para quien lo haya perdido. Se le vuelve a enviar su resultado sin que tú lo veas.</p>
    ${ids.map((id,i)=>{ const p=s.personas.find(x=>x.id===id); if(!p) return ''; const st=(h.enviados||{})[id];
      return `<div class="person"><div class="av" style="background:${color(s.personas.indexOf(p))}">${esc(iniciales(p.nombre))}</div><div class="pinfo"><div class="pname">${esc(p.nombre)} ${st===true?'✅':st===false?'⚠️':''}</div><div class="pmail">${esc(p.email)}</div></div><button class="btn small gold" id="rs_${id}" onclick="reenviarUno('${anio}','${id}')">Enviar</button></div>`; }).join('')}
    <button class="btn block" style="margin-top:12px" onclick="closeModal();render()">Cerrar</button>`);
}
async function reenviarUno(anio, id){
  if(!emailOk()) return toast('Primero configura el correo en Ajustes');
  const s=S(VIEW.id), h=s.historial.find(x=>x.anio==anio), b=$('#rs_'+id);
  b.disabled=true; b.textContent='Enviando…';
  try{ await enviarAPersona(s, dec(h.enc,s.salt), id); (h.enviados ||= {})[id]=true; save(); b.textContent='✓ Enviado'; }
  catch(e){ b.disabled=false; b.textContent='Reintentar'; toast('No se pudo enviar: '+String(e.message).slice(0,80)); }
}
async function borrarAnio(anio){
  if(!await confirmar('¿Borrar el sorteo de '+anio+'?','Se olvidará quién regaló a quién ese año. Las reglas de repetición ya no lo tendrán en cuenta.','Borrar',true)) return;
  const s=S(VIEW.id); s.historial=s.historial.filter(x=>x.anio!=anio); save(); render();
}

/* ---------- Importar Excel ---------- */
let importTarget=null;
function importarExcel(sid){ importTarget=sid; $('#fileExcel').click(); }
function cargarScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
$('#fileExcel').addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    if(!window.XLSX){ toast('Leyendo el Excel…'); await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).map(r=>r.map(c=>String(c).trim())).filter(r=>r.some(Boolean));
    const lista=leerFilas(rows);
    if(!lista.length) return toast('No encontré nombres con correo en ese archivo');
    procesarImport(lista);
  }catch(err){ toast('No pude leer el archivo (¿hay conexión a internet?)'); }
});
function leerFilas(rows){
  if(!rows.length) return [];
  const h=rows[0].map(x=>x.toLowerCase());
  let iN=h.findIndex(x=>/nombre|name|persona/.test(x)), iE=h.findIndex(x=>/correo|e-?mail|mail/.test(x)), iG=h.findIndex(x=>/grupo|sorteo|equipo/.test(x));
  let body=rows;
  if(iN>=0||iE>=0) body=rows.slice(1);
  if(iE<0){ const cols=Math.max(...rows.map(r=>r.length)); let best=-1,bn=0; for(let c=0;c<cols;c++){ const n=body.filter(r=>/@/.test(r[c]||'')).length; if(n>bn){bn=n;best=c;} } iE=best; }
  if(iN<0){ iN = [0,1,2,3].find(c=>c!==iE && c!==iG && body.some(r=>r[c] && !/@/.test(r[c]))) ?? -1; }
  if(iE<0||iN<0) return [];
  return body.map(r=>({nombre:r[iN], email:(r[iE]||'').replace(/^mailto:/i,''), grupo: iG>=0 ? r[iG] : ''})).filter(x=>x.nombre && emailValido(x.email));
}
function meterEn(s, lista){
  let n=0; for(const x of lista){ if(s.personas.some(p=>p.nombre.toLowerCase()===x.nombre.toLowerCase() && p.email.toLowerCase()===x.email.toLowerCase())) continue; s.personas.push({id:uid(),nombre:x.nombre,email:x.email,activo:true}); n++; } return n;
}
function procesarImport(lista){
  if(importTarget){ const n=meterEn(S(importTarget),lista); save(); render(); return toast(`${n} personas importadas 🎄`); }
  if(lista.some(x=>x.grupo)){
    const res=[];
    for(const g of [...new Set(lista.map(x=>x.grupo||'Sin grupo'))]){
      let s=DB.sorteos.find(x=>x.nombre.toLowerCase()===g.toLowerCase()); if(!s){ s=nuevoSorteo(g); DB.sorteos.push(s); }
      res.push(`${esc(s.nombre)}: ${meterEn(s, lista.filter(x=>(x.grupo||'Sin grupo')===g))}`);
    }
    save(); render(); return modal(`<h3 style="margin:0 0 8px">Importado ✓</h3><p class="note" style="font-size:15px">${res.join('<br>')}</p><button class="btn gold block" onclick="closeModal()">Genial</button>`);
  }
  modal(`<h3 style="margin:0 0 6px;font-size:20px">He encontrado ${lista.length} personas</h3><p class="note">¿A qué sorteo las añado?</p>
    ${DB.sorteos.map(s=>`<button class="btn block" style="margin-top:8px" onclick="closeModal();toast(meterEn(S('${s.id}'),window._imp)+' personas importadas 🎄');save();render()">${esc(s.nombre)}</button>`).join('')}
    <button class="btn block ghost" style="margin-top:12px;color:var(--ink2);border-color:#d8c7a8" onclick="closeModal()">Cancelar</button>`);
  window._imp=lista;
}

function bomboSVG(nBalls){
  const cols=['#c0392b','#e9b44c','#fff8ec','#2e8b57','#c0392b','#ffd666','#2e8b57','#fff8ec'];
  let balls=''; for(let i=0;i<nBalls;i++){ const a=(i*137.5)%360*Math.PI/180, rr=18+((i*29)%62); const x=150+Math.cos(a)*rr, y=140+Math.sin(a)*rr;
    balls+=`<g class="ball" style="animation-delay:${(i%5)*.12}s"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="13" fill="${cols[i%cols.length]}"/><circle cx="${(x-4).toFixed(1)}" cy="${(y-4).toFixed(1)}" r="3.5" fill="#fff" opacity=".55"/></g>`; }
  let spokes=''; for(let k=0;k<12;k++){ const a=k*15*Math.PI/180; spokes+=`<line x1="${(150-Math.cos(a)*100).toFixed(1)}" y1="${(140-Math.sin(a)*100).toFixed(1)}" x2="${(150+Math.cos(a)*100).toFixed(1)}" y2="${(140+Math.sin(a)*100).toFixed(1)}" stroke="#e9b44c" stroke-width="2.5" opacity=".55"/>`; }
  return `<svg class="bombo" viewBox="0 0 300 300" role="img" aria-label="Bombo del sorteo">
    <path d="M95 290 L205 290 L182 225 L118 225 Z" fill="#c0392b"/><rect x="88" y="284" width="124" height="12" rx="6" fill="#9e2a1f"/>
    <path d="M118 238 h64" stroke="#e9b44c" stroke-width="4"/><circle cx="150" cy="262" r="9" fill="#ffd666"/>
    <g class="cage">${balls}</g>
    <g class="cage"><circle cx="150" cy="140" r="100" fill="none" stroke="#e9b44c" stroke-width="7"/>${spokes}
      <circle cx="150" cy="140" r="86" fill="none" stroke="#ffd666" stroke-width="1.5" stroke-dasharray="4 8"/></g>
    <circle cx="150" cy="140" r="14" fill="#e9b44c"/><circle cx="150" cy="140" r="6" fill="#9e2a1f"/>
    <g class="crank"><line x1="150" y1="140" x2="150" y2="82" stroke="#ffd666" stroke-width="5" stroke-linecap="round" opacity="0"/></g>
    <path d="M150 18 l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z" fill="#ffd666"/>
    <path d="M55 70 q-12 -20 6 -26 q6 14 -6 26z M245 70 q12 -20 -6 -26 q-6 14 6 26z" fill="#2e8b57"/>
    <circle cx="58" cy="72" r="5" fill="#c0392b"/><circle cx="242" cy="72" r="5" fill="#c0392b"/>
  </svg>`;
}

async function empezarSorteo(id, simulacion=false){
  const s=S(id);
  const activos=s.personas.filter(p=>p.activo!==false);
  if(activos.length<3) return toast('Hacen falta al menos 3 personas');
  const malos=activos.filter(p=>!emailValido(p.email));
  if(malos.length && !simulacion) return toast('Revisa el correo de '+malos[0].nombre);
  if(!simulacion && !emailOk()){
    if(await confirmar('Falta conectar el Gmail del sorteo','Sin eso no se pueden enviar los resultados. ¿Lo conectamos ahora? (Si solo quieres ver la animación, usa el menú ⋯ → Probar la animación.)','Conectar')) return go({v:'ajustes'});
    return;
  }
  if(!simulacion && !nubeCargada){
    toast('Leyendo los datos de la nube…'); await cargarNube();
    if(!nubeCargada) return toast('No hay conexión con la nube. Revisa internet e inténtalo de nuevo.');
  }
  const anio = s.evento.fecha ? +s.evento.fecha.slice(0,4) : new Date().getFullYear();
  if(!simulacion){
    if(s.historial.some(h=>h.anio===anio) && !await confirmar(`Ya hay un sorteo de ${anio}`,`Si lo repites, se anula el anterior y todos recibirán un correo nuevo con su nuevo amigo invisible. Avisa a la familia de que el primero ya no vale.`,'Repetir sorteo',true)) return;
    if(!s.evento.fecha || !s.evento.lugar){
      if(!await confirmar('Faltan datos del reparto', `No has puesto ${!s.evento.fecha?'el día':''}${!s.evento.fecha&&!s.evento.lugar?' ni ':''}${!s.evento.lugar?'el lugar':''}. En el correo aparecerá “por decidir”. ¿Seguimos?`,'Seguir')) return;
    }
    if(!await confirmar(`¿Lanzamos el sorteo ${anio}?`, `Se enviará un correo a cada una de las <b>${activos.length} personas</b>. Tú recibirás el tuyo igual que los demás, y nadie verá los resultados en la app.`,'¡Adelante!')) return;
  }
  let pares=null, nivel=0;
  for(nivel=0;nivel<3 && !pares;nivel++) pares=resolver(s, anio, nivel);
  nivel--;
  if(!pares) return toast('No se pudo hacer el sorteo. Prueba con más personas.');
  if(nivel>0 && !simulacion){
    const txt = nivel===1 ? 'Con tan pocas personas no se puede cumplir el límite de veces en varios años. Sí se respetará no repetir con el año pasado.' : 'Con tan pocas personas no es posible evitar repetir con el año pasado. Se hará el sorteo sin esa regla.';
    if(!await confirmar('Aviso sobre las reglas', txt, 'Hacerlo igualmente')) return;
  }
  correr(s, anio, pares, simulacion);
}

async function correr(s, anio, pares, simulacion){
  busy=true; VIEW={v:'run'}; history.pushState(VIEW,''); $('.fab')?.remove(); window.scrollTo(0,0);
  const ids=Object.keys(pares);
  app.innerHTML = `${lucesHTML()}
    <h1 style="font-size:34px">${esc(s.nombre)} ${anio}</h1>
    <p class="sub">${simulacion?'🧪 Modo prueba: no se envía ni se guarda nada':'No cierres la app hasta que termine'}</p>
    <div class="bombo-wrap spinning" id="bw">${bomboSVG(Math.min(ids.length,22))}</div>
    <div class="status" id="st">🎅 Papá Noel está mezclando los nombres…</div>
    <div class="tray" id="tray"></div>
    <div id="fin"></div>`;
  await sleep(2600);
  let rec=null;
  if(!simulacion){
    s.historial = s.historial.filter(h=>h.anio!==anio);
    rec={anio, creado:new Date().toISOString(), enc:enc(pares,s.salt), enviados:{}};
    s.historial.push(rec); save();
  }
  // orden de envío aleatorio para que no se pueda deducir nada
  const orden=shuffle([...ids]); let ok=0, fallos=[];
  for(const gid of orden){
    const p=s.personas.find(x=>x.id===gid);
    $('#st').textContent=`🦌 Llevando la carta a ${p.nombre}…`;
    let bien=true;
    try{ if(simulacion) await sleep(260); else { await enviarAPersona(s,pares,gid); await sleep(250); } }
    catch(e){ bien=false; fallos.push(gid); console.warn(e); }
    if(rec){ rec.enviados[gid]=bien; save(); }
    if(bien) ok++;
    const i=s.personas.indexOf(p);
    $('#tray').insertAdjacentHTML('beforeend', `<div class="tball ${bien?'':'fail'}" style="background:${color(i)}" title="${esc(p.nombre)}">${esc(iniciales(p.nombre))}<span class="ck">${bien?'✓':'!'}</span></div>`);
  }
  $('#bw').classList.remove('spinning');
  busy=false;
  if(!simulacion) subir();
  if(!fallos.length){
    $('#st').textContent = simulacion ? '❄️ Así quedará el día del sorteo ❄️' : `✉️ ${ok} cartas entregadas`;
    $('#st').insertAdjacentHTML('beforebegin','<div class="feliz">¡Feliz Navidad!</div>');
    nevada(); villancico();
  }else{
    $('#st').textContent = `${ok} enviados · ${fallos.length} sin enviar`;
  }
  $('#fin').innerHTML = `
    ${fallos.length?`<div class="warn">No se pudo enviar a: <b>${fallos.map(id=>esc(s.personas.find(x=>x.id===id).nombre)).join(', ')}</b>. El sorteo está guardado; revisa su correo o tu conexión y pulsa reintentar.</div>
      <button class="btn gold block" id="retry">↻ Reintentar los que fallaron</button>`:''}
    ${!simulacion&&!fallos.length?`<div class="card" style="text-align:center"><div style="font-size:34px">🤫</div><b>Resultado guardado bajo llave</b><p class="note">Cada persona tiene su amigo invisible en su correo. Si alguien no lo encuentra, que mire en spam. Puedes reenviárselo desde la pestaña Historial.</p></div>`:''}
    <button class="btn block" style="margin-top:10px" onclick="go({v:'sorteo',id:'${s.id}',tab:'${simulacion?'personas':'reglas'}'})">Volver al sorteo</button>`;
  $('#retry')?.addEventListener('click', async ()=>{
    const b=$('#retry'); b.disabled=true; b.textContent='Reintentando…';
    for(const gid of [...fallos]){ try{ await enviarAPersona(s,pares,gid); rec.enviados[gid]=true; save(); fallos.splice(fallos.indexOf(gid),1); await sleep(250);}catch(e){} }
    if(!fallos.length){ toast('¡Todos enviados! 🎄'); nevada(); villancico(); b.remove(); $('.warn')?.remove(); $('#st').textContent='✉️ ¡Todas las cartas entregadas!'; }
    else { b.disabled=false; b.textContent=`↻ Reintentar (${fallos.length} pendientes)`; }
  });
}

/* =========================================================
   NIEVE Y CONFETI
   ========================================================= */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
(function nieve(){
  const c=$('#snow'), x=c.getContext('2d'); let W,H,f=[];
  const rs=()=>{ W=c.width=innerWidth*devicePixelRatio; H=c.height=innerHeight*devicePixelRatio; c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px'; };
  rs(); addEventListener('resize',rs);
  for(let i=0;i<70;i++) f.push({x:Math.random(),y:Math.random(),r:Math.random()*2.2+.8,s:Math.random()*.0012+.0005,d:Math.random()*Math.PI*2});
  function step(){ x.clearRect(0,0,W,H); x.fillStyle='rgba(255,255,255,.75)';
    for(const p of f){ if(!reduce){ p.y+=p.s; p.d+=.01; p.x+=Math.sin(p.d)*.0004; if(p.y>1.02){p.y=-.02;p.x=Math.random();} }
      x.beginPath(); x.arc(p.x*W,p.y*H,p.r*devicePixelRatio,0,7); x.fill(); }
    if(!reduce) requestAnimationFrame(step); }
  step();
})();
function nevada(){
  if(reduce) return;
  const c=$('#confetti'), x=c.getContext('2d'), dpr=devicePixelRatio;
  c.width=innerWidth*dpr; c.height=innerHeight*dpr; c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
  const formas=['❄','❅','❆','❄','❅','❆','✦'];
  const P=[]; for(let i=0;i<140;i++) P.push({x:Math.random()*c.width, y:-Math.random()*c.height*0.7-20*dpr, s:(Math.random()*22+14)*dpr,
    vy:(Math.random()*1.4+1.1)*dpr, d:Math.random()*6.28, vd:Math.random()*.03+.01, r:Math.random()*6.28, vr:(Math.random()-.5)*.03,
    ch:formas[i%formas.length], col: i%7===6 ? '#ffd666' : (i%3===0 ? '#cfeaff' : '#ffffff'), a:Math.random()*.4+.6});
  const t0=performance.now();
  (function frame(t){ const el=(t-t0)/1000; x.clearRect(0,0,c.width,c.height);
    const fade = el>6.5 ? Math.max(0,1-(el-6.5)/1.5) : 1;
    for(const p of P){ p.y+=p.vy; p.d+=p.vd; p.x+=Math.sin(p.d)*.9*dpr; p.r+=p.vr;
      x.save(); x.globalAlpha=p.a*fade; x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.col; x.font=p.s+'px serif'; x.textAlign='center'; x.textBaseline='middle';
      x.shadowColor='rgba(255,255,255,.6)'; x.shadowBlur=6*dpr; x.fillText(p.ch,0,0); x.restore(); }
    if(fade>0) requestAnimationFrame(frame); else x.clearRect(0,0,c.width,c.height); })(t0);
}
/* Cascabeles al terminar (melodía popular de dominio público) */
function villancico(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ac=new AC(); const N={C:523.25,D:587.33,E:659.25,F:698.46,G:783.99};
    const notas='E1 E1 E2 E1 E1 E2 E1 G1 C1.5 D.5 E4'.split(' ');
    let t=ac.currentTime+.05; const q=.17;
    for(const n of notas){ const f=N[n[0]], dur=parseFloat(n.slice(1))*q;
      for(const [mult,vol] of [[1,.22],[2,.07],[3,.03]]){ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=f*mult;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(dur,.15)+.35);
        o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.5); }
      t+=dur; }
    // cascabeles
    for(let i=0;i<14;i++){ const tt=ac.currentTime+.05+i*.17, b=ac.createBufferSource(), len=ac.sampleRate*.06, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
      for(let k=0;k<len;k++) d[k]=(Math.random()*2-1)*Math.pow(1-k/len,3); b.buffer=buf; const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000; const g=ac.createGain(); g.gain.value=.12;
      b.connect(hp).connect(g).connect(ac.destination); b.start(tt); }
  }catch(e){}
}
