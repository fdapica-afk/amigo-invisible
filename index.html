<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amigo invisible en familia</title>
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Amigo invisible">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Noche dorada */
  --bg:#14213d; --bg2:#1d2d50; --bg3:#26385f;
  --cream:#fbf8f1; --cream2:#efe7d6; --ink:#1d2d50; --ink2:#6b6455;
  --red:#b08a3e; --red2:#8a6a2c; --gold:#e5c07b; --gold2:#f3dfae; --green:#3d7a5c; --danger:#a33a3a;
  --r:18px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:Nunito,system-ui,sans-serif;font-size:16px;min-height:100%}
body{padding:calc(var(--safe-t) + 8px) 0 calc(var(--safe-b) + 110px)}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 16px}
h1,h2,.xmas{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;letter-spacing:.5px}
h1{font-size:40px;margin:6px 0 0;color:var(--gold2);text-align:center;line-height:1.05}
h2{font-size:30px;margin:0;color:var(--gold2)}
.sub{color:#c9d3e6;text-align:center;margin:4px 0 18px;font-size:15px}
.top{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.top h2{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:transparent;color:var(--gold2);font-size:20px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.card{background:var(--cream);color:var(--ink);border-radius:var(--r);padding:16px;margin-bottom:14px;position:relative}
.card.ribbon{overflow:hidden}
.card.ribbon:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(45deg,var(--gold) 0 8px,var(--bg2) 8px 16px)}
.sorteo-card{display:flex;align-items:center;gap:14px;cursor:pointer;padding-left:24px}
.sorteo-card .big{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--red2);line-height:1}
.sorteo-card .meta{font-size:14px;color:var(--ink2);margin-top:4px}
.sorteo-card .arrow{margin-left:auto;font-size:26px;color:var(--red)}
.badge{display:inline-block;background:var(--cream2);color:var(--ink2);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600;margin:4px 6px 0 0}
.badge.ok{background:#d9f0e2;color:#1b5e3a}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font:800 16px Nunito,sans-serif;cursor:pointer;background:var(--cream2);color:var(--ink)}
.btn.red{background:var(--gold);color:#14213d}
.btn.danger{background:var(--danger);color:#fff}
.btn.gold{background:var(--gold);color:#14213d}
.btn.ghost{background:transparent;color:var(--gold2);border:2px dashed var(--gold)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 16px);z-index:20;width:min(528px,calc(100% - 32px));font-size:20px;padding:16px;border-radius:18px;box-shadow:0 6px 0 var(--red2),0 10px 30px rgba(0,0,0,.4);font-family:'Cormorant Garamond',serif}
.fab:active{transform:translateX(-50%) translateY(3px);box-shadow:0 3px 0 var(--red2)}
.tabs{display:flex;background:var(--bg2);border-radius:14px;padding:4px;margin-bottom:14px;gap:4px}
.tabs button{flex:1;border:0;background:transparent;color:#c9d3e6;font:800 13px Nunito,sans-serif;padding:10px 2px;border-radius:10px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--gold);color:#14213d}
label{display:block;font-weight:800;font-size:14px;margin:10px 0 4px;color:var(--ink2)}
input,textarea,select{width:100%;border:2px solid #e3dccb;background:#fff;border-radius:12px;padding:11px 12px;font:16px Nunito,sans-serif;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{min-height:200px;resize:vertical;line-height:1.45}
.row2{display:flex;gap:10px}.row2>*{flex:1;min-width:0}
.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #e3dccb}
.person:last-child{border-bottom:0}
.person.off{opacity:.45}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none;color:#fff}
.pname{font-weight:800}
.pmail{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinfo{flex:1;min-width:0}
.mini{border:0;background:var(--cream2);color:var(--ink);width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;flex:none}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#d6cdb8;border-radius:99px;transition:.2s}
.switch span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span:before{transform:translateX(18px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:0;background:var(--cream2);color:var(--red2);border-radius:999px;padding:6px 10px;font:800 13px Nunito,sans-serif;cursor:pointer}
.preview{background:#fff;border:2px solid var(--gold);border-radius:14px;padding:14px;white-space:pre-wrap;line-height:1.5;font-size:15px}
.secret{background:var(--bg2);color:var(--gold);border-radius:8px;padding:1px 8px;font-weight:800}
.note{font-size:14px;color:var(--ink2);line-height:1.45}
.warn{background:#fff1d6;border:2px solid var(--gold);color:#5a3a06;border-radius:14px;padding:12px;font-size:14px;line-height:1.45;margin-bottom:14px}
.banner{background:var(--bg3);border:2px solid var(--gold);color:#fff;border-radius:var(--r);padding:14px 16px;margin-bottom:14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.empty{text-align:center;padding:16px 6px;color:var(--ink2)}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #e3dccb}
.hist:last-child{border-bottom:0}
.hist .y{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--red2);width:70px}
.steps{padding-left:20px;line-height:1.55;font-size:15px}
.steps li{margin-bottom:8px}
code{background:var(--cream2);padding:1px 6px;border-radius:6px;font-size:14px;word-break:break-all}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(5,20,14,.75);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(var(--safe-b) + 16px)}
#modal.show{display:flex}
#modal .card{width:100%;max-width:520px;max-height:85vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translateX(-50%) translateY(-120px);background:var(--cream);color:var(--ink);padding:12px 18px;border-radius:14px;font-weight:800;z-index:70;transition:.3s;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:90%}
#toast.show{transform:translateX(-50%) translateY(0)}
/* Bombo */
.bombo-wrap{display:flex;justify-content:center;margin:8px 0}
.bombo{width:min(300px,78vw);height:auto;overflow:visible}
.cage{transform-origin:150px 140px;animation:spin 9s linear infinite}
.spinning .cage{animation-duration:.7s}
.ball{animation:jiggle 1.4s ease-in-out infinite}
.spinning .ball{animation-duration:.35s}
.crank{transform-origin:150px 140px;animation:spin 9s linear infinite}
.spinning .crank{animation-duration:.7s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes jiggle{50%{transform:translateY(-6px)}}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:50px;margin:10px 0 4px}
.tball{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;position:relative;animation:pop .45s cubic-bezier(.3,1.6,.5,1);box-shadow:inset -5px -6px 0 rgba(0,0,0,.18),inset 4px 4px 0 rgba(255,255,255,.35)}
.tball .ck{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--green);font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tball.fail .ck{color:var(--red)}
@keyframes pop{from{transform:translateY(-120px) scale(.3);opacity:0}}
.status{text-align:center;font-size:18px;font-weight:800;color:var(--gold2);min-height:28px}
.lights{display:flex;justify-content:space-between;margin:0 6px -4px;height:18px}
.lights i{width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;display:block;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.cage,.crank,.ball,.lights i{animation:none!important}}
.footer-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 20px}
.sr{position:absolute;left:-9999px}
.card{padding-top:22px}
.card:after{content:"";position:absolute;left:0;right:0;top:0;height:16px;border-radius:var(--r) var(--r) 0 0;pointer-events:none;
  background:radial-gradient(circle at 17px 5px,#fff 9px,transparent 10px) 0 0/34px 16px repeat-x,radial-gradient(circle at 8px 0,#fff 7px,transparent 8px) 9px 0/47px 14px repeat-x}
#modal .card:after{display:none}
.nube{display:inline-block;font-size:13px;font-weight:800;padding:4px 12px;border-radius:999px;background:var(--bg2);color:#c9d3e6}
.nube.error{background:#5a2a16;color:#ffd666}
.card .nube{background:var(--cream2);color:var(--ink2)}
#ground{position:fixed;left:0;right:0;bottom:0;height:70px;z-index:0;pointer-events:none}
.garland{display:block;width:100%;height:56px;margin-bottom:-6px}
html.reyes,body.reyes{--bg:#211a44;--bg2:#2d2360;--bg3:#3a2d78;--cream:#fbf6ff;--cream2:#ece3f7;--ink:#2a1840;--ink2:#6b5a80;--red:#c27c2c;--red2:#8f5a1c;--gold:#e9b44c;--gold2:#ffd666;--green:#3d7a5c}
html.invierno,body.invierno{--bg:#0b1530;--bg2:#132147;--bg3:#1b2a52;--cream:#eef4ff;--cream2:#dde7f7;--ink:#0b1530;--ink2:#5a6b8c;--red:#2f8f7a;--red2:#1f6b5a;--gold:#5fd3b0;--gold2:#e6f6ff;--green:#2f8f7a}
body.invierno .fab{box-shadow:0 6px 0 #2f8f7a,0 10px 30px rgba(0,0,0,.4)}
.mueve{animation:balanceo 3.4s ease-in-out infinite}
.spinning .mueve{animation:agitar .32s ease-in-out infinite}
.gira{animation:spin 9s linear infinite}
.spinning .gira{animation-duration:.8s}
.salta{animation:saltar 1.8s ease-in-out infinite}
.spinning .salta{animation-duration:.45s}
@keyframes balanceo{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes agitar{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes saltar{50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.mueve,.gira,.salta{animation:none!important}}
.garland .b{animation:blink 2.2s infinite}
.tball{margin-top:8px}
.tball:before{content:"";position:absolute;top:-7px;left:50%;width:14px;height:8px;margin-left:-7px;background:#e5c07b;border-radius:3px 3px 1px 1px;box-shadow:0 -4px 0 -2px #e9b44c}
.feliz{font-family:'Cormorant Garamond',serif;font-size:38px;color:var(--gold2);text-align:center;margin:6px 0}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>
<svg id="ground" viewBox="0 0 400 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40 Q40 18 90 34 T190 30 T290 36 T400 26 V70 H0Z" fill="#c9d3e6" opacity=".16"/><path d="M0 52 Q60 36 120 50 T240 46 T400 44 V70 H0Z" fill="#ffffff" opacity=".22"/></svg>
<div id="app"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="card" id="modalBox"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="fileExcel" class="sr" accept=".xlsx,.xls,.csv,.ods">
<input type="file" id="fileBackup" class="sr" accept=".json,application/json">

<script>
'use strict';
/* =========================================================
   DATOS
   ========================================================= */
const LS_KEY = 'amigoInvisible.v1';
const COLORS = ['#b08a3e','#3b5b92','#7a5c99','#2f6f73','#9c5b45','#4a6fa5','#8a6d3b','#5b7bb5','#a0522d','#6b7a3c'];
const DEFAULT_MSG =
`¡Hola {nombre}! 🎄

Ya se ha hecho el sorteo del amigo invisible ({sorteo}) y te ha tocado hacerle el regalo a...

🎁 {amigo} 🎁

📅 Día: {fecha}
📍 Lugar: {lugar}
💶 Presupuesto: {presupuesto}

¡Shhh! No se lo digas a nadie 🤫`;

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function randHex(n=16){ const a=new Uint8Array(n); crypto.getRandomValues(a); return [...a].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function nuevoSorteo(nombre){
  return { id:uid(), nombre, personas:[],
    evento:{ fecha:'', hora:'', lugar:'', presupuesto:'', asunto:'🎁 Tu amigo invisible · {sorteo}', mensaje:DEFAULT_MSG },
    reglas:{ noRepetirAnterior:true, maxVeces:2, ventana:5 },
    historial:[], salt:randHex() };
}
function seed(){ return { sorteos:[nuevoSorteo('Adultos'), nuevoSorteo('Primos')], rev:0 }; }
function load(){
  try{ const d = JSON.parse(localStorage.getItem(LS_KEY)); if(d && Array.isArray(d.sorteos)){ delete d.emailjs; return d; } }catch(e){}
  return seed();
}
let DB = load();
setTimeout(()=>{ const a=repararTextos(), b=asegurarTokens(); if(a||b) guardarLocal(); },0);
function asegurarTokens(){ let c=false; (DB.sorteos||[]).forEach(s=>(s.personas||[]).forEach(p=>{ if(!p.token){ p.token=randHex(12); c=true; } if(!p.cuestionario){ p.cuestionario=tipoDe(p); c=true; } })); return c; }
/* Menor de 16 → cuestionario de niños; si no, por el nombre */
function tipoDe(p){ return (p.edad && +p.edad < 16) ? 'ninos' : tipoPorNombre(p.nombre); }
const respondidoEsteAnio = p => !!(p.respondido && +String(p.respondido).slice(0,4) === new Date().getFullYear());
const ETIQUETA_TIPO = p => p.cuestionario==='ninos' ? '🧒 Niño/a'+(p.edad?' ('+p.edad+' años)':'') : p.cuestionario==='completo' ? '👩 Mujer' : '👨 Hombre';
const VERSION_GOOGLE = '3.4';
function asisteDe(p,s){ const h=registroActualApp(s); return (h && p.asistencia && p.asistencia.anio===h.anio) ? p.asistencia.resp : ''; }
function asisteTxt(p,s){ const r=asisteDe(p,s); return r==='si'?'🙋 Viene · ':r==='no'?'🚫 No viene · ':r==='nose'?'🤔 No lo sabe · ':''; }
let ESTADO = null;
async function cargarEstado(){ if(!conectado()) return null; try{ ESTADO = await llamar('estado'); }catch(e){ ESTADO = null; } return ESTADO; }
/* Mujer → cuestionario completo · Hombre → cuestionario rápido (se deduce del nombre) */
const NOMBRES_M = 'carmen pilar isabel raquel ines belen rocio consuelo dolores mercedes nieves beatriz ruth rut noemi abigail esther ester maribel mabel sol luz iris miriam lourdes montse montserrat maite irene amparo rosario paz flor marisol remedios soledad piedad trinidad asuncion concepcion encarnacion inmaculada merche pili mari cristi zoe abril carol leire leyre elisabet ivonne itziar uxue maialen ane elene josune nahia alba arantxa yasmin jazmin chloe lis noor mar maria'.split(' ');
const NOMBRES_H = 'borja luca bautista joshua isaias jeremias nicola elias tobias matias lucas andreas jona josema chema garcia'.split(' ');
function tipoPorNombre(nombre){
  const n = String(nombre||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(/[\s\-]+/)[0];
  if(!n) return 'sencillo';
  if(NOMBRES_M.includes(n)) return 'completo';
  if(NOMBRES_H.includes(n)) return 'sencillo';
  return /a$/.test(n) ? 'completo' : 'sencillo';
}

/* ---------- Conexión con Google (datos en Drive + envío con Gmail) ---------- */
const CONF_KEY = 'amigoInvisible.conexion';
let CONF = (()=>{ try{ return JSON.parse(localStorage.getItem(CONF_KEY)) || {url:'',clave:''}; }catch(e){ return {url:'',clave:''}; } })();
function guardarConf(){ try{ localStorage.setItem(CONF_KEY, JSON.stringify(CONF)); }catch(e){} }
const conectado = () => !!(CONF.url && CONF.clave);
let NUBE = 'off';            // off · cargando · ok · subiendo · error
let nubeCargada = false;     // ¿hemos leído ya los datos de la nube en esta sesión?
let pendiente = false, subirT = null;

/* Envía todo en ASCII (emojis y tildes como \uXXXX) para que Google no los estropee */
function soloAscii(t){ return t.replace(/[\u007f-\uffff]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4,'0')); }
/* Arregla textos que ya se estropearon (emojis convertidos en �) */
const sinEmoji = t => String(t||'').replace(/[\uFFFD\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\uFE0F\u200D]/gu,'').replace(/\s+/g,' ').trim();
function repararTextos(){
  let cambio=false;
  for(const s of DB.sorteos||[]){ const ev=s.evento; if(!ev) continue;
    if(/\uFFFD/.test(ev.mensaje||'')){ ev.mensaje = sinEmoji(ev.mensaje)===sinEmoji(DEFAULT_MSG) ? DEFAULT_MSG : ev.mensaje.replace(/\uFFFD+/g,''); cambio=true; }
    if(/\uFFFD/.test(ev.asunto||'')){ ev.asunto = '🎁 Tu amigo invisible · {sorteo}'; cambio=true; }
  }
  return cambio;
}
async function llamar(accion, extra={}){
  const r = await fetch(CONF.url.trim(), { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: soloAscii(JSON.stringify({accion, clave:CONF.clave, ...extra})) });
  let j; try{ j = await r.json(); }catch(e){ throw new Error('La dirección de conexión no responde bien. Revisa que termina en /exec y que el acceso es “Cualquier usuario”.'); }
  if(!j.ok) throw new Error(j.error || 'Error');
  return j;
}
function pintarNube(){
  const el = document.getElementById('nube'); if(!el) return;
  const t = { off:'📱 Solo en este móvil', cargando:'☁️ Cargando…', ok:'☁️ Guardado en la nube', subiendo:'☁️ Guardando…', error:'⚠️ Sin conexión: se guardará al volver' }[NUBE];
  el.textContent = t; el.className = 'nube ' + NUBE;
}
function setNube(s){ NUBE = s; pintarNube(); }
async function cargarNube(){
  if(!conectado()) { setNube('off'); return; }
  if(nubeCargada && $('#modal').classList.contains('show')) return; // no cambiar datos con una ventana abierta
  setNube('cargando');
  try{
    const j = await llamar('leer');
    if(j.datos && Array.isArray(j.datos.sorteos)){
      if(pendiente && (DB.rev||0) > (j.datos.rev||0) && localStorage.getItem('amigoInvisible.sync')===CONF.url){ nubeCargada = true; await subir(); return; }
      DB = j.datos; guardarLocal(); localStorage.setItem('amigoInvisible.sync', CONF.url);
      { const a=repararTextos(), b=asegurarTokens(), c=/^https?:/.test(location.protocol) && (DB.appUrl!==new URL('./', location.href).href || DB.scriptUrl!==CONF.url.trim()); if(a||b||c){ nubeCargada = true; save(); } }
    } else { nubeCargada = true; await subir(); return; } // primera vez: subimos lo que hay en el móvil
    nubeCargada = true; setNube('ok');
    if(!busy && !$('#modal').classList.contains('show') && !document.activeElement?.matches('input,textarea')) render();
  }catch(e){ setNube('error'); console.warn(e); }
}
async function subir(){
  clearTimeout(subirT);
  if(!conectado() || !nubeCargada) return;
  setNube('subiendo');
  try{ await llamar('guardar', {datos:DB}); pendiente=false; localStorage.setItem('amigoInvisible.sync', CONF.url); setNube('ok'); }
  catch(e){ pendiente=true; setNube('error'); console.warn(e); }
}

/* Los resultados se guardan codificados: la app los usa para las reglas
   y para reenviar correos, pero nunca los muestra en pantalla. */
function keyBytes(salt){ const out=[]; let h=2166136261; for(let i=0;i<256;i++){ h ^= salt.charCodeAt(i % salt.length) + i; h = Math.imul(h,16777619)>>>0; out.push(h & 255); } return out; }
function enc(obj, salt){ const k=keyBytes(salt); const b=new TextEncoder().encode(JSON.stringify(obj)); let s=''; b.forEach((x,i)=> s += String.fromCharCode(x ^ k[i % k.length])); return btoa(s); }
function dec(str, salt){ try{ const k=keyBytes(salt); const s=atob(str); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i) ^ k[i % k.length]; return JSON.parse(new TextDecoder().decode(b)); }catch(e){ return {}; } }

/* =========================================================
   SORTEO (algoritmo)
   ========================================================= */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* nivel 0: todas las reglas · 1: sin límite de veces · 2: sin reglas de historial */
function resolver(s, anio, nivel){
  const ids = s.personas.filter(p=>p.activo!==false).map(p=>p.id);
  const r = s.reglas;
  const hist = s.historial.filter(h=>h.anio < anio).sort((a,b)=>b.anio-a.anio).map(h=>({anio:h.anio, pares:dec(h.enc, s.salt)}));
  const anterior = hist[0];
  const veces = (g,x) => hist.filter(h => h.anio > anio - r.ventana && h.pares[g]===x).length;
  const opciones = {};
  for(const g of ids){
    opciones[g] = ids.filter(x => x!==g
      && !(nivel<2 && r.noRepetirAnterior && anterior && anterior.pares[g]===x)
      && !(nivel<1 && r.maxVeces>0 && veces(g,x) >= r.maxVeces));
  }
  const res = {}, usado = new Set(); let pasos = 0;
  function bt(pend){
    if(!pend.length) return true;
    if(++pasos > 300000) return false;
    // el que menos opciones tenga primero
    let best=-1, bestN=1e9;
    pend.forEach((g,i)=>{ const n=opciones[g].filter(x=>!usado.has(x)).length; if(n<bestN){bestN=n;best=i;} });
    if(bestN===0) return false;
    const g = pend[best]; const resto = pend.filter((_,i)=>i!==best);
    for(const x of shuffle(opciones[g].filter(x=>!usado.has(x)))){
      res[g]=x; usado.add(x);
      if(bt(resto)) return true;
      usado.delete(x); delete res[g];
    }
    return false;
  }
  return bt(shuffle([...ids])) ? res : null;
}

function esc(t){ return String(t??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fechaTexto(ev){
  if(!ev.fecha) return 'por decidir';
  const d = new Date(ev.fecha+'T12:00:00');
  let t = d.toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
  if(ev.hora) t += ' a las ' + ev.hora;
  return t;
}
function listaIdeas(t){ return String(t||'').split(/\n|;|•/).map(x=>x.replace(/^\s*[-*·]\s*/,'').trim()).filter(Boolean); }
/* Si el mensaje no lleva {ideas} y la persona tiene ideas, se añaden al final */
/* Ideas que pone el organizador + respuestas del cuestionario */
function pack(a){ return { lista: listaIdeas(a && a.ideas), resumen: (a && a.respuestas && a.respuestas.lista) || [] }; }
const PACK0 = {lista:[], resumen:[]};
function plantilla(s, pk=PACK0){ const m=s.evento.mensaje||''; if(m.includes('{ideas}') || (!pk.lista.length && !pk.resumen.length)) return m; return m + '\n\n💡 Pistas sobre sus gustos:\n{ideas}'; }
function textoIdeas(pk){ const L=[...pk.lista.map(x=>'• '+x), ...pk.resumen.map(r=>'• '+r.q+': '+r.a)]; return L.length ? L.join('\n') : 'Esta vez no hay pistas: ¡sorpréndele!'; }
function vars(s, persona, amigo, pk=PACK0){
  const ev = s.evento;
  return { ideasLista:pk.lista, resumen:pk.resumen, ideas: textoIdeas(pk), nombre:persona, amigo, sorteo:s.nombre, fecha:fechaTexto(ev), lugar:ev.lugar||'por decidir', presupuesto: presupuestoTexto(ev) };
}
/* Presupuesto: mínimo y/o máximo. Solo mínimo → "mínimo 25 €"; los dos → "entre 25 y 50 €" */
function presupuestoTexto(ev){
  ev = ev || {};
  const n = v => String(v == null ? '' : v).trim().replace(/\s*€$/, '');
  const e = v => /\d$/.test(v) ? v + ' €' : v;
  const mn = n(ev.presMin), mx = n(ev.presMax);
  if (mn && mx) return 'entre ' + mn + ' y ' + e(mx);
  if (mn) return 'mínimo ' + e(mn);
  if (mx) return 'máximo ' + e(mx);
  const p = n(ev.presupuesto); return p ? e(p) : 'sin límite';
}
function rellenar(tpl, v){ return tpl.replace(/\{(\w+)\}/g, (m,k)=> (k in v && k!=='ideasLista' && k!=='resumen') ? v[k] : m); }
function htmlCorreo(s, v, tpl){ return htmlCorreo0(s, v, tpl ?? s.evento.mensaje).replace(/[\u{80}-\u{10FFFF}]/gu, c => '&#' + c.codePointAt(0) + ';'); }
function htmlCorreo0(s, v, tpl){
  const cuerpo = esc(tpl).replace(/\{(\w+)\}/g, (m,k)=>{
    if(k==='ideas'){

  }).replace(/\n/g,'<br>');
  return `<div style="background:#0f2e22;padding:24px 12px;font-family:Georgia,'Times New Roman',serif">
<div style="max-width:480px;margin:0 auto;background:#fff8ec;border-radius:18px;overflow:hidden;border:3px solid #e9b44c">

<p style="text-align:center;color:#9fb0c9;font-size:12px;font-family:Arial,sans-serif">Este mensaje es solo para ti. Nadie más ha visto el resultado.</p></div>`;
}

async function ofrecerAlta(s, p){

  const r=await tresOpciones(`¿Añadir a ${esc(p.nombre)} al sorteo de ${h.anio}?`, `El sorteo de este año ya está hecho. Si lo añades, <b>solo cambia una persona</b>: esa persona pasará a regalar a ${esc(p.nombre)}, y ${esc(p.nombre)} regalará a quien le tocaba a ella. Solo esas dos reciben correo.`, 'Añadir al sorteo', 'Solo para próximos años');
  if(r===1) await ajustarSorteo(s, 'alta', p.id);

/* ¿Se puede que g regale a x, según las reglas de años anteriores? */
function permitido(s, anio, g, x){
  if(g===x) return false;
  const r=s.reglas, hist=s.historial.filter(h=>h.anio<anio).sort((a,b)=>b.anio-a.anio).map(h=>dec(h.enc,s.salt));
  if(r.noRepetirAnterior && hist[0] && hist[0][g]===x) return false;
  if(r.maxVeces>0){ const desde=anio-r.ventana; let n=0; s.historial.filter(h=>h.anio<anio && h.anio>desde).forEach(h=>{ if(dec(h.enc,s.salt)[g]===x) n++; }); if(n>=r.maxVeces) return false; }
  return true;
}
/* Reajusta la cadena cambiando lo mínimo y manda correo solo a quien cambia */
async function ajustarSorteo(s, tipo, pid){
  if(!conectado()) return toast('Conecta primero el Gmail del sorteo');
  await cargarNube(); s=S(s.id); const h=sorteoVivo(s); if(!h) return;
  const pares=dec(h.enc,s.salt), anio=h.anio, ok=(g,x)=>permitido(s,anio,g,x), afectados=[];
  if(tipo==='baja'){
    if(!(pid in pares)) return;
    const g=Object.keys(pares).find(k=>pares[k]===pid), y=pares[pid];
    delete pares[pid]; if(h.enviados) delete h.enviados[pid]; if(h.leidos) delete h.leidos[pid];
    if(Object.keys(pares).length<3) return toast('Quedarían menos de 3 personas en el sorteo');
    if(y!==g && ok(g,y)){ pares[g]=y; afectados.push(g); }
    else {
      // Se intercambia con otra persona para que nadie se regale a sí mismo ni repita
      const cands=shuffle(Object.keys(pares).filter(k=>k!==g && k!==y && pares[k]!==g));
      let h2=cands.find(k=>ok(g,pares[k]) && ok(k, y===g ? g : y)) || cands[0];
      const z=pares[h2]; pares[g]=z; pares[h2]= (y===g) ? g : y; afectados.push(g,h2);
    }
  } else {
    if(pid in pares) return;
    const cands=shuffle(Object.keys(pares));
    const hh=cands.find(k=>ok(k,pid) && ok(pid,pares[k])) || cands[0];
    const z=pares[hh]; pares[hh]=pid; pares[pid]=z; afectados.push(hh,pid);
  }
  // comprobación: todos regalan y reciben una vez, nadie a sí mismo
  const ks=Object.keys(pares), vs=new Set(Object.values(pares));
  if(vs.size!==ks.length || ks.some(k=>pares[k]===k || !vs.has(k))) return toast('No se pudo reajustar. Inténtalo otra vez.');
  h.enc=enc(pares,s.salt); h.enviados=h.enviados||{}; h.leidos=h.leidos||{};
  afectados.forEach(a=>{ h.enviados[a]=false; delete h.leidos[a]; });
  h.ajustes=(h.ajustes||[]).concat([{tipo, f:new Date().toISOString()}]);
  save(); await subir();
  if(pendiente) return toast('⚠️ No se pudo guardar en la nube. Inténtalo de nuevo.');
  let n=0;
  for(const a of afectados){ try{ await enviarAPersona(s, anio, a); h.enviados[a]=true; n++; }catch(e){} }
  save(); render();
  toast(n===afectados.length ? `✓ Sorteo reajustado. ${n===1?'Se ha enviado 1 correo':'Se han enviado '+n+' correos'}.` : '⚠️ Algún correo no salió: reenvíalo desde el Historial.');
}

async function enviarCuestionarioA(s, p){
  if(!conectado()){ toast('Primero conecta el Gmail del sorteo en Ajustes'); return false; }
  if(!emailValido(p.email)){ toast('Revisa el correo de '+p.nombre); return false; }
  if(!p.cuestionario){ toast('Elige primero si '+p.nombre+' es Mujer u Hombre'); return false; }
  if(pendiente || !nubeCargada){ await (nubeCargada ? subir() : cargarNube()); if(pendiente) await subir(); }
  if(NUBE==='error'){ toast('Sin conexión con la nube. Inténtalo de nuevo.'); return false; }
  { const s2=DB.sorteos.find(x=>x.id===s.id), p2=s2 && s2.personas.find(x=>x.id===p.id); if(s2 && p2){ if(!p2.cuestionario) p2.cuestionario=p.cuestionario; s=s2; p=p2; } }
  try{
    await llamar('enviarCuestionario', { sid:s.id, pid:p.id });
    p.cuestEnviado=new Date().toISOString(); save(); return true;
  }catch(e){ toast('No se pudo enviar a '+p.nombre+': '+String(e.message).slice(0,60)); return false; }
}
async function enviarCuestionarios(){
  if(!conectado()) return toast('Primero conecta el Gmail del sorteo en Ajustes');
  await cargarNube();
  if(pendiente) await subir();
  const s=S(VIEW.id); if(!s) return;
  const lista=s.personas.filter(p=>p.activo!==false && !respondidoEsteAnio(p) && emailValido(p.email));
  if(!lista.length) return toast('Todos lo han rellenado 🎉');
  if(lista.some(p=>!p.cuestionario) && !await asignarTipos(lista)) return;
  if(!await confirmar('¿Enviar el cuestionario?', `Se enviará a <b>${lista.length}</b> ${lista.length===1?'persona':'personas'}: ${lista.map(p=>esc(p.nombre)).join(', ')}.`, 'Enviar')) return;
  let ok=0;
  for(const p of lista){ toast(`✉️ Enviando a ${p.nombre}…`); if(await enviarCuestionarioA(s,p)) ok++; await sleep(300); }
  toast(`Cuestionario enviado a ${ok} de ${lista.length} 🎄`); render();
}

/* ---------- Fechas ---------- */
function aLocal(iso){ if(!iso) return ''; const d=new Date(iso), z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes()); }
function aISO(local){ return local ? new Date(local).toISOString() : ''; }
function fechaCorta(iso){ return iso ? new Date(iso).toLocaleString('es-ES',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : ''; }
function registroActualApp(s){ return [...(s.historial||[])].filter(h=>h.estado!=='programado').sort((a,b)=>b.anio-a.anio)[0]||null; }

/* ---------- Sorteo: ahora o programado ---------- */
function elegirCuando(anio, n){
  return new Promise(res=>{
    const man=new Date(); man.setDate(man.getDate()+1); man.setHours(20,0,0,0);
    modal(`<h3 style="margin:0 0 8px;font-size:20px">¿Lanzamos el sorteo ${anio}?</h3>
      <p class="note" style="font-size:15px">Se enviará un correo a cada una de las <b>${n} personas</b>. Tú recibirás el tuyo igual que los demás, y nadie verá los resultados en la app.</p>
      <button class="btn red block" id="cAhora">🎰 ¡Ahora!</button>
      <div style="margin-top:14px;padding-top:12px;border-top:1px dashed #e3dccb"><b>⏰ O prográmalo para más tarde</b>
      <p class="note" style="margin:4px 0 8px">El sorteo se hace ahora y queda guardado bajo llave, pero los correos salen solos en el día y la hora que elijas (con unos minutos de margen), aunque no abras la app.</p>
      <input type="datetime-local" id="cFecha" value="${aLocal(man.toISOString())}">
      <button class="btn gold block" style="margin-top:8px" id="cProg">Programar envío</button></div>
      <button class="btn block" style="margin-top:12px" id="cNo">Cancelar</button>`);
    $('#cAhora').onclick=()=>{ closeModal(); res('ahora'); };
    $('#cNo').onclick=()=>{ closeModal(); res(null); };
    $('#cProg').onclick=()=>{ const v=$('#cFecha').value; if(!v) return toast('Elige día y hora'); if(new Date(v)<new Date()) return toast('Esa fecha ya ha pasado'); closeModal(); res(aISO(v)); };
  });
}
async function programarSorteo(s, anio, cuando){
  await cargarEstado();
  if(ESTADO && !ESTADO.tareas && !await confirmar('Faltan las tareas automáticas','Para que el sorteo salga solo, activa antes las tareas automáticas en ⚙️ Ajustes. ¿Quieres programarlo igualmente y activarlas después?','Programar igualmente')) return;
  let pares=null, nivel=0;
  for(nivel=0;nivel<3 && !pares;nivel++) pares=resolver(s, anio, nivel);
  if(!pares) return toast('No se pudo hacer el sorteo. Prueba con más personas.');
  s.historial = s.historial.filter(h=>h.anio!==anio);
  s.historial.push({id:uid(), anio, creado:new Date().toISOString(), enc:enc(pares,s.salt), enviados:{}, estado:'programado', programado:cuando});
  save(); await subir();
  if(pendiente) return toast('⚠️ No se ha podido guardar en la nube. Inténtalo de nuevo.');
  toast('⏰ Sorteo programado para el '+fechaCorta(cuando));
  go({v:'sorteo', id:s.id, tab:'reglas'});
}

/* ---------- 🗳️ Votación de fecha y lugar ---------- */
function resumenVotos(s){
  const v=s.votacion||{}, votos=v.votos||{}, act=s.personas.filter(p=>p.activo!==false);
  const nombre=id=>(s.personas.find(p=>p.id===id)||{}).nombre||'?';
  const fechas=(v.fechas||[]).map(f=>{ const c={si:[],quiza:[],no:[]}; Object.keys(votos).forEach(id=>{ const x=(votos[id].fechas||{})[f.id]; if(c[x]) c[x].push(nombre(id)); }); return Object.assign({},f,{c, punt:c.si.length*2+c.quiza.length}); });
  const lugares=(v.lugares||[]).map(l=>({...l, n:Object.values(votos).filter(x=>x.lugar===l.id).length}));
  const mejor=fechas.length?fechas.reduce((a,b)=>b.punt>a.punt||(b.punt===a.punt&&b.c.no.length<a.c.no.length)?b:a):null;
  const mejorL=lugares.length?lugares.reduce((a,b)=>b.n>a.n?b:a):null;
  const sinVotar=act.filter(p=>!votos[p.id]).map(p=>p.nombre);
  const coment=Object.keys(votos).filter(id=>votos[id].comentario).map(id=>({n:nombre(id),t:votos[id].comentario}));
  return {v, fechas, lugares, mejor:mejor&&mejor.punt>0?mejor:null, mejorL:mejorL&&mejorL.n>0?mejorL:null, votantes:Object.keys(votos).length, total:act.length, sinVotar, coment};
}
function tVotacion(s){
  const v=s.votacion;
  if(!v || !v.abierta){
    return `<div class="card"><b style="font-size:18px">🗳️ Votar el día del reparto</b>
      <p class="note" style="margin-top:4px">Propón varios días (y sitios si quieres). Cada uno marca si puede ✅, quizá 🤔 o no ❌, y se elige el día en que podáis ir más.</p>
      ${v&&v.cerrada?`<p class="note">✅ Última votación cerrada el ${esc(fechaCorta(v.cerrada))}.</p>`:''}
      <button class="btn gold block" id="vtNueva">🗳️ Crear una votación</button></div>`;
  }
  const R=resumenVotos(s);
  const fila=f=>{ const tot=Math.max(1,R.votantes), es=R.mejor&&R.mejor.id===f.id;
    return `<div style="border-top:1px dashed #e3dccb;padding:10px 0${es?';background:rgba(61,122,92,.08);border-radius:10px;padding-left:8px;padding-right:8px':''}">

function editarVotacion(s){
  const v=s.votacion&&s.votacion.abierta?s.votacion:{fechas:[],lugares:[]};
  const fs=(v.fechas.length?v.fechas:[{},{},{}]);
  const filaF=(f,i)=>`<div class="row2" style="margin-top:6px"><input type="date" class="vfF" value="${esc(f.fecha||'')}" data-id="${f.id||''}"><input type="time" class="vfH" value="${esc(f.hora||'')}" style="max-width:120px"></div>`;
  modal(`<h3 style="margin:0 0 6px;font-size:20px">🗳️ Votación del día</h3>
    <p class="note">Días posibles (la hora es opcional):</p><div id="vfL">${fs.map(filaF).join('')}</div>
    <button class="btn small" id="vfMas" style="margin-top:6px">＋ Otro día</button>
    <label for="vlL" style="margin-top:12px">Sitios posibles (opcional, uno por línea)</label>
    <textarea id="vlL" rows="3" placeholder="Casa de los abuelos&#10;Restaurante…">${esc((v.lugares||[]).map(l=>l.nombre).join('\n'))}</textarea>
    ${v.votos&&Object.keys(v.votos).length?'<p class="note">Los votos ya hechos se mantienen para los días que no cambies.</p>':''}
    <div class="row2" style="margin-top:12px"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn gold" id="vfG">Guardar</button></div>`);
  $('#vfMas').onclick=()=>$('#vfL').insertAdjacentHTML('beforeend', filaF({},0));
  $('#vfG').onclick=()=>{
    const fF=[...document.querySelectorAll('.vfF')], fH=[...document.querySelectorAll('.vfH')];
    const fechas=fF.map((x,i)=>({id:x.dataset.id||uid(), fecha:x.value, hora:fH[i].value})).filter(f=>f.fecha).sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
    if(fechas.length<1) return toast('Pon al menos un día');
    const ant=v.lugares||[], lugares=$('#vlL').value.split('\n').map(x=>x.trim()).filter(Boolean).map(n=>(ant.find(l=>l.nombre===n)||{id:uid(),nombre:n}));
    const nueva=!(s.votacion&&s.votacion.abierta);
    s.votacion = nueva ? {id:uid(), abierta:true, fechas, lugares, votos:{}} : Object.assign(s.votacion,{fechas, lugares});
    closeModal(); save(); render(); toast(nueva?'Votación creada. Ahora envíala 📨':'Guardado');
  };
}
function enganchaVotacion(s){
  $('#vtNueva')?.addEventListener('click',()=>editarVotacion(s));
  $('#vtEdit')?.addEventListener('click',()=>editarVotacion(s));
  $('#vtAct')?.addEventListener('click',async()=>{ toast('Cargando…'); await cargarNube(); render(); });
  $('#vtCerrar')?.addEventListener('click',async()=>{ if(!await confirmar('¿Cerrar la votación?','Ya no se podrá votar. Los resultados se pierden de la pantalla (elige antes el día).','Cerrar')) return; s.votacion={id:s.votacion.id, abierta:false, cerrada:new Date().toISOString()}; save(); render(); });
  $('#vtEnv')?.addEventListener('click',async()=>{
    if(!conectado()) return toast('Conecta primero Google en ⚙️ Ajustes');
    if(!await confirmar('¿Enviar la votación?','A cada persona del sorteo le llegará un correo con un botón para votar los días'+((s.votacion.lugares||[]).length?' y el sitio':'')+'.','Enviar')) return;

  document.querySelectorAll('[data-elf]').forEach(b=>b.onclick=async()=>{
    const f=s.votacion.fechas.find(x=>x.id===b.dataset.elf);

    const R=resumenVotos(s); if(R.mejorL && !s.evento.lugar) s.evento.lugar=R.mejorL.nombre;
    const cerrar=await confirmar('Día elegido 📅','¿Cierras ya la votación para que nadie vote más?','Cerrar votación');
    if(cerrar) s.votacion={id:s.votacion.id, abierta:false, cerrada:new Date().toISOString()};
    save(); render(); toast('Día del reparto: '+fechaTexto(s.evento)); });

/* ---------- 📊 Resumen ---------- */
async function verResumen(sid){
  if(conectado()){ toast('Cargando…'); await cargarNube(); }
  const s=S(sid), act=s.personas.filter(p=>p.activo!==false), ult=registroActualApp(s);
  const pend=act.filter(p=>!respondidoEsteAnio(p));
  let ids=[], env=0, lei=0, noLei=[], apunt=0;
  if(ult){ ids=Object.keys(dec(ult.enc,s.salt)); env=ids.filter(i=>(ult.enviados||{})[i]===true).length; lei=ids.filter(i=>(ult.leidos||{})[i]).length;
    noLei=ids.filter(i=>!(ult.leidos||{})[i]).map(i=>s.personas.find(p=>p.id===i)).filter(Boolean); apunt=s.personas.filter(p=>(p.regalos||[]).some(r=>r.anio===ult.anio)).length; }
  const fila=(t,v,extra='')=>`<div class="hist" style="align-items:flex-start"><div class="pinfo"><div class="pname">${t}</div>${extra?`<div class="pmail" style="white-space:normal">${extra}</div>`:''}</div><b style="font-size:18px">${v}</b></div>`;
  const pintar=(est)=>modal(`<h3 style="margin:0 0 6px;font-size:20px">📊 Resumen · ${esc(s.nombre)}</h3>
    <p class="note">Sin parejas: nadie puede ver quién regala a quién.</p>
    ${fila('👥 Participan', act.length)}
    ${fila('📋 Cuestionario rellenado este año', (act.length-pend.length)+' / '+act.length, pend.length?'Faltan: '+pend.map(p=>esc(p.nombre)).join(', '):'¡Todos! 🎉')}
    ${ult?fila('✉️ Correos del sorteo '+ult.anio, env+' / '+ids.length):''}
    ${ult?fila('👀 Lo han abierto', lei+' / '+ids.length, noLei.length?'Sin abrir: '+noLei.map(p=>esc(p.nombre)).join(', '):''):''}
    ${ult?fila('💬 Preguntas anónimas', est?est.preguntas+' ('+est.respondidas+' respondidas)':'…'):''}
    ${ult?fila('🎁 Han apuntado su regalo', apunt+' / '+ids.length):''}
    ${ult?(()=>{ const ps=ids.map(i=>s.personas.find(p=>p.id===i)).filter(Boolean), v=ps.filter(p=>asisteDe(p,s)==='si'), n=ps.filter(p=>asisteDe(p,s)==='no'); return fila('🙋 Vienen al reparto', v.length+' / '+ps.length, n.length?'No vienen: '+n.map(p=>esc(p.nombre)).join(', '):''); })():''}
    ${ESTADO?fila('📮 Correos que quedan hoy', ESTADO.restantes):''}
    <button class="btn block" style="margin-top:12px" onclick="closeModal()">Cerrar</button>`);
  pintar(null);
  if(conectado() && ult){ try{ const est=await llamar('estadisticas',{sid}); if($('#modal').classList.contains('show')) pintar(est); }catch(e){} }
}

async function conexionDesdeEnlace(){
  if(!location.hash.startsWith('#c=')) return;
  let c=null; try{ c=JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3))))); }catch(e){}
  history.replaceState(VIEW,'',location.pathname+location.search);
  if(!c || !c.url || !c.clave) return toast('Ese enlace de conexión no es válido');
  if(conectado() && CONF.url===c.url && CONF.clave===c.clave) return toast('Este móvil ya está conectado ✓');
  if(!await confirmar('¿Conectar este móvil?','Este móvil podrá ver y organizar los sorteos de la familia.','Conectar')) return;
  CONF={url:c.url, clave:c.clave}; guardarConf(); nubeCargada=false; await cargarNube(); toast('¡Conectado! 🎄'); render();
}

    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).map(r=>r.map(c=>String(c).trim())).filter(r=>r.some(Boolean));
    const lista=leerFilas(rows);

function leerFilas(rows){
  if(!rows.length) return [];
  const h=rows[0].map(x=>x.toLowerCase());
  let iN=h.findIndex(x=>/nombre|name|persona/.test(x)), iE=h.findIndex(x=>/correo|e-?mail|mail/.test(x)), iG=h.findIndex(x=>/grupo|sorteo|equipo/.test(x)), iI=h.findIndex(x=>/idea|gusto|regalo/.test(x));
  let body=rows;
  if(iN>=0||iE>=0||iI>=0) body=rows.slice(1);
  if(iE<0){ const cols=Math.max(...rows.map(r=>r.length)); let best=-1,bn=0; for(let c=0;c<cols;c++){ const n=body.filter(r=>/@/.test(r[c]||'')).length; if(n>bn){bn=n;best=c;} } iE=best; }
  if(iN<0){ iN = [0,1,2,3].find(c=>c!==iE && c!==iG && body.some(r=>r[c] && !/@/.test(r[c]))) ?? -1; }
  if(iN<0 || (iE<0 && iI<0)) return [];
  return body.map(r=>({nombre:r[iN], email:iE>=0?(r[iE]||'').replace(/^mailto:/i,''):'', grupo: iG>=0 ? r[iG] : '', ideas: iI>=0 ? r[iI] : ''})).filter(x=>x.nombre && (emailValido(x.email) || x.ideas));
}
function meterEn(s, lista){
  let n=0; const norm=t=>String(t).trim().toLowerCase();
  for(const x of lista){
    const ya=s.personas.find(p=>norm(p.nombre)===norm(x.nombre) && (!x.email || norm(p.email)===norm(x.email)));
    if(ya){ if(x.ideas){ ya.ideas=x.ideas.replace(/\s*[;|]\s*/g,'\n'); ya.ideasAt=new Date().toISOString(); n++; } continue; }
    if(!emailValido(x.email)) continue;
    s.personas.push({id:uid(),token:randHex(12),cuestionario:tipoPorNombre(x.nombre),nombre:x.nombre,email:x.email,ideas:(x.ideas||'').replace(/\s*[;|]\s*/g,'\n'),activo:true}); n++;
  } return n;
}
function procesarImport(lista){
  if(importTarget){ const n=meterEn(S(importTarget),lista); save(); render(); return toast(`${n} personas importadas o actualizadas 🎄`); }
  if(lista.some(x=>x.grupo)){
    const res=[];
    for(const g of [...new Set(lista.map(x=>x.grupo||'Sin grupo'))]){
      let s=DB.sorteos.find(x=>x.nombre.toLowerCase()===g.toLowerCase()); if(!s){ s=nuevoSorteo(g); DB.sorteos.push(s); }
      res.push(`${esc(s.nombre)}: ${meterEn(s, lista.filter(x=>(x.grupo||'Sin grupo')===g))}`);
    }
    save(); render(); return modal(`<h3 style="margin:0 0 8px">Importado ✓</h3><p class="note" style="font-size:15px">${res.join('<br>')}</p><button class="btn gold block" onclick="closeModal()">Genial</button>`);
  }

    ${DB.sorteos.map(s=>`<button class="btn block" style="margin-top:8px" onclick="closeModal();toast(meterEn(S('${s.id}'),window._imp)+' personas importadas o actualizadas 🎄');save();render()">${esc(s.nombre)}</button>`).join('')}

  window._imp=lista;
}

function bolitas(n, cx, cy, rad, cols){
  let h=''; for(let i=0;i<n;i++){ const a=(i*137.5)%360*Math.PI/180, rr=rad*(.25+((i*29)%70)/100); const x=cx+Math.cos(a)*rr, y=cy+Math.sin(a)*rr;
    h+=`<g class="ball" style="animation-delay:${(i%5)*.12}s"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="12" fill="${cols[i%cols.length]}"/><circle cx="${(x-4).toFixed(1)}" cy="${(y-4).toFixed(1)}" r="3.2" fill="#fff" opacity=".55"/></g>`; }
  return h;
}

async function empezarSorteo(id, simulacion=false){
  const s=S(id);
  const activos=s.personas.filter(p=>p.activo!==false);
  if(activos.length<3) return toast('Hacen falta al menos 3 personas');
  const malos=activos.filter(p=>!emailValido(p.email));
  if(malos.length && !simulacion) return toast('Revisa el correo de '+malos[0].nombre);
  if(!simulacion && !emailOk()){
    if(await confirmar('Falta conectar el Gmail del sorteo','Sin eso no se pueden enviar los resultados. ¿Lo conectamos ahora? (Si solo quieres ver la animación, usa el menú ⋯ → Probar la animación.)','Conectar')) return go({v:'ajustes'});
    return;
  }
  if(!simulacion && !nubeCargada){
    toast('Leyendo los datos de la nube…'); await cargarNube();
    if(!nubeCargada) return toast('No hay conexión con la nube. Revisa internet e inténtalo de nuevo.');
  }
  const anio = s.evento.fecha ? +s.evento.fecha.slice(0,4) : new Date().getFullYear();
  if(!simulacion){
    if(s.historial.some(h=>h.anio===anio) && !await confirmar(`Ya hay un sorteo de ${anio}`,`Si lo repites, se anula el anterior y todos recibirán un correo nuevo con su nuevo amigo invisible. Avisa a la familia de que el primero ya no vale.`,'Repetir sorteo',true)) return;
    if(!s.evento.fecha || !s.evento.lugar){
      if(!await confirmar('Faltan datos del reparto', `No has puesto ${!s.evento.fecha?'el día':''}${!s.evento.fecha&&!s.evento.lugar?' ni ':''}${!s.evento.lugar?'el lugar':''}. En el correo aparecerá “por decidir”. ¿Seguimos?`,'Seguir')) return;
    }
    const cuando = await elegirCuando(anio, activos.length);
    if(!cuando) return;
    if(cuando!=='ahora') return programarSorteo(s, anio, cuando);
  }
  let pares=null, nivel=0;
  for(nivel=0;nivel<3 && !pares;nivel++) pares=resolver(s, anio, nivel);
  nivel--;
  if(!pares) return toast('No se pudo hacer el sorteo. Prueba con más personas.');
  if(nivel>0 && !simulacion){
    const txt = nivel===1 ? 'Con tan pocas personas no se puede cumplir el límite de veces en varios años. Sí se respetará no repetir con el año pasado.' : 'Con tan pocas personas no es posible evitar repetir con el año pasado. Se hará el sorteo sin esa regla.';
    if(!await confirmar('Aviso sobre las reglas', txt, 'Hacerlo igualmente')) return;
  }
  correr(s, anio, pares, simulacion);
}

async function correr(s, anio, pares, simulacion){
  busy=true; VIEW={v:'run', id:s.id}; history.pushState(VIEW,''); aplicarTema(temaDe(s)); const TT=TEMA_APP[temaDe(s)]; $('.fab')?.remove(); window.scrollTo(0,0);
  const ids=Object.keys(pares);
  app.innerHTML = `${decoHTML(temaDe(s))}
    <h1 style="font-size:34px">${esc(s.nombre)} ${anio}</h1>
    <p class="sub">${simulacion?'🧪 Modo prueba: no se envía ni se guarda nada':'No cierres la app hasta que termine'}</p>
    <div class="bombo-wrap spinning" id="bw">${bomboSVG(Math.min(ids.length,22), temaDe(s))}</div>
    <div class="status" id="st">${TT.mezcla}</div>
    <div class="tray" id="tray"></div>
    <div id="fin"></div>`;
  await sleep(2600);
  let rec=null;
  if(!simulacion){
    s.historial = s.historial.filter(h=>h.anio!==anio);
    rec={id:uid(), anio, creado:new Date().toISOString(), enc:enc(pares,s.salt), enviados:{}, estado:'enviado'};
    s.historial.push(rec); save();
    await subir();
    if(pendiente){
      $('#bw').classList.remove('spinning'); busy=false;
      $('#st').textContent='⚠️ Sin conexión con la nube';
      $('#fin').innerHTML='<div class="warn">No se ha podido guardar el sorteo en la nube, así que no se ha enviado nada. Revisa la conexión y vuelve a hacer el sorteo.</div><button class="btn block" onclick="go({v:\'sorteo\',id:\''+s.id+'\',tab:\'reglas\'})">Volver</button>';
      return;
    }
  }
  // orden de envío aleatorio para que no se pueda deducir nada
  const orden=shuffle([...ids]); let ok=0, fallos=[];
  for(const gid of orden){
    const p=s.personas.find(x=>x.id===gid);
    $('#st').textContent=TT.lleva(p.nombre);
    let bien=true;
    try{ if(simulacion) await sleep(260); else { await enviarAPersona(s,anio,gid); await sleep(150); } }
    catch(e){ bien=false; fallos.push(gid); console.warn(e); }
    if(rec){ rec.enviados[gid]=bien; save(); }
    if(bien) ok++;
    const i=s.personas.indexOf(p);
    $('#tray').insertAdjacentHTML('beforeend', `<div class="tball ${bien?'':'fail'}" style="background:${color(i)}" title="${esc(p.nombre)}">${esc(iniciales(p.nombre))}<span class="ck">${bien?'✓':'!'}</span></div>`);
  }
  $('#bw').classList.remove('spinning');
  busy=false;
  if(!simulacion) subir();
  if(!fallos.length){
    const em={navidad:'✨',reyes:'👑',invierno:'❄️'}[temaDe(s)];
    $('#st').textContent = simulacion ? `${em} Así quedará el día del sorteo ${em}` : `✉️ ${ok} cartas entregadas`;
    $('#st').insertAdjacentHTML('beforebegin','<div class="feliz">'+TT.fiesta+'</div>');
    nevada(); villancico();
  }else{
    $('#st').textContent = `${ok} enviados · ${fallos.length} sin enviar`;
  }
  $('#fin').innerHTML = `
    ${fallos.length?`<div class="warn">No se pudo enviar a: <b>${fallos.map(id=>esc(s.personas.find(x=>x.id===id).nombre)).join(', ')}</b>. El sorteo está guardado; revisa su correo o tu conexión y pulsa reintentar.</div>
      <button class="btn gold block" id="retry">↻ Reintentar los que fallaron</button>`:''}
    ${!simulacion&&!fallos.length?`<div class="card" style="text-align:center"><div style="font-size:34px">🤫</div><b>Resultado guardado bajo llave</b><p class="note">Cada persona tiene su correo${(s.opciones||{}).rasca!==false?' con el botón para rascar y descubrir a su amigo invisible':''}. Si alguien no lo encuentra, que mire en spam. Puedes reenviárselo desde la pestaña Historial, y ver ahí quién lo ha abierto.</p></div>`:''}
    <button class="btn block" style="margin-top:10px" onclick="go({v:'sorteo',id:'${s.id}',tab:'${simulacion?'personas':'reglas'}'})">Volver al sorteo</button>`;
  $('#retry')?.addEventListener('click', async ()=>{
    const b=$('#retry'); b.disabled=true; b.textContent='Reintentando…';
    for(const gid of [...fallos]){ try{ await enviarAPersona(s,anio,gid); rec.enviados[gid]=true; save(); fallos.splice(fallos.indexOf(gid),1); await sleep(150);}catch(e){} }
    if(!fallos.length){ toast('¡Todos enviados! 🎄'); nevada(); villancico(); b.remove(); $('.warn')?.remove(); $('#st').textContent='✉️ ¡Todas las cartas entregadas!'; }
    else { b.disabled=false; b.textContent=`↻ Reintentar (${fallos.length} pendientes)`; }
  });
}

/* =========================================================
   NIEVE Y CONFETI
   ========================================================= */
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
(function nieve(){
  const c=$('#snow'), x=c.getContext('2d'); let W,H,f=[];
  const rs=()=>{ W=c.width=innerWidth*devicePixelRatio; H=c.height=innerHeight*devicePixelRatio; c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px'; };
  rs(); addEventListener('resize',rs);
  for(let i=0;i<70;i++) f.push({x:Math.random(),y:Math.random(),r:Math.random()*2.2+.8,s:Math.random()*.0012+.0005,d:Math.random()*Math.PI*2});
  const PAL={navidad:['rgba(255,255,255,.6)'], reyes:['rgba(255,214,102,.7)','rgba(255,255,255,.55)'], invierno:['rgba(230,246,255,.7)','rgba(95,211,176,.55)','rgba(255,255,255,.6)']};
  function step(){ x.clearRect(0,0,W,H); const pal=PAL[document.body.classList.contains('reyes')?'reyes':document.body.classList.contains('invierno')?'invierno':'navidad']; let k=0;
    for(const p of f){ x.fillStyle=pal[(k++)%pal.length]; if(!reduce){ p.y+=p.s; p.d+=.01; p.x+=Math.sin(p.d)*.0004; if(p.y>1.02){p.y=-.02;p.x=Math.random();} }
      x.beginPath(); x.arc(p.x*W,p.y*H,p.r*devicePixelRatio,0,7); x.fill(); }
    if(!reduce) requestAnimationFrame(step); }
  step();
})();
function nevada(){
  if(reduce) return;
  const c=$('#confetti'), x=c.getContext('2d'), dpr=devicePixelRatio;
  c.width=innerWidth*dpr; c.height=innerHeight*dpr; c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
  const t=temaActual(), conf=false;
  const formas= t==='reyes' ? ['★','✦','✧'] : t==='invierno' ? ['❄','❅','✦','❆','✧'] : ['✦','✧','★','❄','✦','✧','❅'];
  const paleta= t==='invierno' ? ['#5fd3b0','#e6f6ff','#9b7fd1','#ffffff'] : t==='reyes' ? ['#ffd666','#e9b44c','#ffffff'] : ['#e5c07b','#f3dfae','#ffffff'];
  const P=[]; for(let i=0;i<70;i++) P.push({x:Math.random()*c.width, y:-Math.random()*c.height*0.7-20*dpr, s:(Math.random()*10+9)*dpr,
    vy:(Math.random()*1.4+1.1)*dpr, d:Math.random()*6.28, vd:Math.random()*.03+.01, r:Math.random()*6.28, vr:(Math.random()-.5)*.03,
    ch:formas[i%formas.length], col: paleta[i%paleta.length], a:Math.random()*.4+.6});
  const t0=performance.now();
  (function frame(t){ const el=(t-t0)/1000; x.clearRect(0,0,c.width,c.height);
    const fade = el>6.5 ? Math.max(0,1-(el-6.5)/1.5) : 1;
    for(const p of P){ p.y+=p.vy; p.d+=p.vd; p.x+=Math.sin(p.d)*.9*dpr; p.r+=p.vr;
      x.save(); x.globalAlpha=p.a*fade; x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.col; x.font=p.s+'px serif'; x.textAlign='center'; x.textBaseline='middle';
      if(conf){ x.fillRect(-p.s/3,-p.s/6,p.s/1.5,p.s/3); } else { x.shadowColor='rgba(255,255,255,.6)'; x.shadowBlur=6*dpr; x.fillText(p.ch,0,0); } x.restore(); }
    if(fade>0) requestAnimationFrame(frame); else x.clearRect(0,0,c.width,c.height); })(t0);
}
/* Cascabeles al terminar (melodía popular de dominio público) */
function villancico(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ac=new AC(); const N={C:523.25,D:587.33,E:659.25,F:698.46,G:783.99};
    const notas='E1 E1 E2 E1 E1 E2 E1 G1 C1.5 D.5 E4'.split(' ');
    let t=ac.currentTime+.05; const q=.17;
    for(const n of notas){ const f=N[n[0]], dur=parseFloat(n.slice(1))*q;
      for(const [mult,vol] of [[1,.22],[2,.07],[3,.03]]){ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=f*mult;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(dur,.15)+.35);
        o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.5); }
      t+=dur; }
    // cascabeles
    for(let i=0;i<14;i++){ const tt=ac.currentTime+.05+i*.17, b=ac.createBufferSource(), len=ac.sampleRate*.06, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
      for(let k=0;k<len;k++) d[k]=(Math.random()*2-1)*Math.pow(1-k/len,3); b.buffer=buf; const hp=ac.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=6000; const g=ac.createGain(); g.gain.value=.12;
      b.connect(hp).connect(g).connect(ac.destination); b.start(tt); }
  }catch(e){}
}

conexionDesdeEnlace();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
