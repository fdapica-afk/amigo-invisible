<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎁 Tu amigo invisible</title>
<meta name="theme-color" content="#0f2e22">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#14213d;--cab:#1d2d50;--cab2:#0f1a33;--acento:#e5c07b;--claro:#e5c07b;--papel:#fbf8f1;--tinta:#1d2d50;--sub:#c9d3e6;--borde:#e5c07b;--nombre:#b08a3e;--titulo:'Cormorant Garamond',Georgia,serif}
body.reyes{--borde:#6b3fa0;--nombre:#6b3fa0;--ok:#2e8b57;--bg:#211a44;--cab:#6b3fa0;--cab2:#4f2d7a;--papel:#fbf6ff;--tinta:#2a1840;--sub:#d9cff0;--titulo:Georgia,serif}
body.cumple{--borde:#e0457b;--nombre:#e0457b;--ok:#2e8b57;--bg:#123a4a;--cab:#e0457b;--cab2:#b8325f;--acento:#2ec4b6;--claro:#ffe066;--papel:#fffaf3;--tinta:#2b1b2e;--sub:#cde8ee;--titulo:Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--papel);font-family:Nunito,Arial,sans-serif;padding:16px 14px 40px;min-height:100vh}
.w{max-width:560px;margin:0 auto;position:relative;z-index:1}
h1{font-family:var(--titulo);color:var(--claro);text-align:center;font-size:34px;margin:8px 0 4px;line-height:1.1}
.sub{text-align:center;color:var(--sub);margin:0 0 16px;line-height:1.45}
.card{background:var(--papel);color:var(--tinta);border-radius:18px;padding:16px;margin-bottom:14px;border-top:6px solid var(--borde)}
.card h2{font-family:var(--titulo);color:var(--cab2);margin:0 0 8px;font-size:24px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:800 17px Nunito,Arial;background:var(--cab);color:#fff;cursor:pointer;margin-top:10px}
.btn.sec{background:transparent;color:var(--cab2);border:2px solid var(--acento)}
.btn[disabled]{opacity:.6}
textarea,input{width:100%;border:2px solid #e4d3b4;border-radius:12px;padding:11px 12px;font:16px Nunito,Arial;color:var(--tinta);background:#fff}
textarea{min-height:90px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--acento)}
.nota{font-size:13px;color:#7a6a5a;line-height:1.45}
.ideas{background:#fff;border:2px dashed var(--acento);border-radius:12px;padding:10px 14px;line-height:1.55;margin:8px 0}
.res{background:#fff;border:2px solid var(--acento);border-radius:12px;padding:6px 14px;margin:8px 0}
.res div{padding:7px 0;border-top:1px dashed #e4d3b4}.res div:first-child{border-top:0}
.res span{display:block;font-size:13px;color:#7a6a5a}
.qa{background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0;border-left:5px solid var(--acento)}
.qa .r{margin-top:6px;color:#2e6b4a;font-weight:700}
.qa .p{margin-top:6px;color:#a0670a;font-size:14px}
.evento{display:grid;gap:6px;font-size:16px}
a{color:#2c7fb8;word-break:break-all}
/* Rasca y descubre */
.rasca{position:relative;width:100%;height:170px;border-radius:18px;overflow:hidden;background:var(--papel);box-shadow:0 0 0 4px var(--acento);margin:10px 0 6px;touch-action:none;user-select:none}
.premio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--nombre);text-align:center;padding:10px}
.premio small{color:#7a6a5a;font-size:14px}
.premio b{font-family:var(--titulo);font-size:44px;line-height:1.05}
#capa{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;transition:opacity .8s}
.grande{font-family:var(--titulo);color:var(--nombre);font-size:46px;text-align:center;margin:4px 0;line-height:1.05}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0}
.aviso{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--papel);color:var(--tinta);padding:12px 16px;border-radius:12px;font-weight:800;z-index:9;max-width:90%;display:none;box-shadow:0 8px 24px rgba(0,0,0,.3)}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="w" id="app"><h1>🎁</h1><p class="sub">Cargando…</p></div>
<div class="aviso" id="aviso" role="status"></div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const K = Q.get('k') || '', M = Q.get('m') || 'ver', QID = Q.get('q') || '', URLG = Q.get('u') || '';
const app = document.getElementById('app');
const esc = t => String(t==null?'':t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enlazar = t => esc(t).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>');
const soloAscii = t => t.replace(/[\u007f-￿]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4,'0'));
const EMO = {navidad:'✨', reyes:'👑', cumple:'🎂'};
let D = null;
function aviso(t){ const el=document.getElementById('aviso'); el.textContent=t; el.style.display='block'; clearTimeout(aviso.t); aviso.t=setTimeout(()=>el.style.display='none',3500); }
async function llamar(o){
  const r = await fetch(URLG,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:soloAscii(JSON.stringify(o))});
  const j = await r.json(); if(!j.ok) throw new Error(j.error||'Error'); return j;
}
function tema(t){ document.body.className = t||'navidad'; }
function noValido(t){ app.innerHTML='<h1>Amigo invisible</h1><div class="card">'+esc(t||'Este enlace no es válido o ya no existe. Pide ayuda a quien organiza el sorteo.')+'</div>'; }

async function inicio(){
  if(!K || !/^https:\/\/script\.google(usercontent)?\.com\//.test(URLG)) return noValido();
  try{
    if(M==='responder'){ D = await llamar({accion:'pregunta', k:K, q:QID}); tema(D.tema); return vistaResponder(); }
    D = await llamar({accion:'amigo', k:K});
  }catch(e){ return noValido(/no válido/i.test(e.message)?null:'No se ha podido cargar. Revisa tu conexión y vuelve a abrir el enlace.'); }
  tema(D.tema);
  if(D.sinSorteo || !D.amigo) return noValido('Todavía no se ha hecho el sorteo. ¡Un poco de paciencia!');
  if(M==='ok'){ llamar({accion:'revelar',k:K}).catch(()=>{}); D.revelado=true; return contenido('¡Gracias por confirmarlo! ✅'); }
  if(M==='preguntar' || M==='regalo' || D.revelado) return contenido();
  vistaRasca();
}

/* ---------- Rasca y descubre ---------- */
function vistaRasca(){
  app.innerHTML = `<h1>¡Hola, ${esc(D.nombre)}!</h1>
    <p class="sub">${EMO[D.tema]||'🎁'} ${esc(D.sorteo)} ${D.anio}<br>Rasca con el dedo para descubrir a tu amigo invisible</p>
    <div class="rasca" id="rasca"><div class="premio"><small>Te ha tocado regalar a…</small><b>${esc(D.amigo)}</b></div><canvas id="capa"></canvas></div>
    <p class="sub" style="font-size:13px">🤫 Solo tú puedes ver esto</p>`;
  const box=document.getElementById('rasca'), c=document.getElementById('capa'), x=c.getContext('2d'), dpr=devicePixelRatio||1;
  const W=box.clientWidth, H=box.clientHeight; c.width=W*dpr; c.height=H*dpr; x.scale(dpr,dpr);
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,'#c9c9c9'); g.addColorStop(.5,'#eeeeee'); g.addColorStop(1,'#b5b5b5');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(120,120,120,.35)'; x.font='22px serif';
  for(let i=0;i<40;i++) x.fillText(['✦','❄','★','✧'][i%4], (i*53)%W, 20+((i*37)%H));
  x.fillStyle='#6d6d6d'; x.font='800 22px Nunito,Arial'; x.textAlign='center'; x.fillText('✨ Rasca aquí ✨', W/2, H/2+8);
  x.globalCompositeOperation='destination-out';
  let abajo=false, hecho=false, mov=0, ult=null;
  const pos=e=>{ const r=c.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  const rascar=p=>{ x.lineWidth=46; x.lineCap='round'; x.beginPath(); if(ult){ x.moveTo(ult.x,ult.y); x.lineTo(p.x,p.y); x.stroke(); } x.beginPath(); x.arc(p.x,p.y,23,0,7); x.fill(); ult=p;
    if(++mov%8===0) comprobar(); };
  const comprobar=()=>{ if(hecho) return; const d=x.getImageData(0,0,c.width,c.height).data; let v=0,n=0; for(let i=3;i<d.length;i+=64){ n++; if(d[i]<128) v++; } if(v/n>0.5) descubrir(); };
  const descubrir=()=>{ if(hecho) return; hecho=true; c.style.opacity=0; setTimeout(()=>c.remove(),800); fiesta(); llamar({accion:'revelar',k:K}).catch(()=>{}); D.revelado=true; setTimeout(()=>contenido(),1600); };
  c.addEventListener('pointerdown',e=>{ abajo=true; ult=null; c.setPointerCapture(e.pointerId); rascar(pos(e)); });
  c.addEventListener('pointermove',e=>{ if(abajo) rascar(pos(e)); });
  c.addEventListener('pointerup',()=>{ abajo=false; ult=null; comprobar(); });
}

/* ---------- Página con todo ---------- */
function contenido(msg){
  if(!D.revelado){ D.revelado=true; llamar({accion:'revelar',k:K}).catch(()=>{}); }   // cuenta como "lo ha abierto"
  const P=D.pistas||{ideas:[],resumen:[]};
  let h = `<h1>${EMO[D.tema]||'🎁'} ${esc(D.sorteo)} ${D.anio}</h1>
    <div class="card" style="text-align:center"><div class="nota">${msg?esc(msg)+'<br>':''}${esc(D.nombre)}, te ha tocado regalar a…</div><div class="grande">${esc(D.amigo)}</div></div>
    <div class="card"><h2>📅 El reparto</h2><div class="evento"><div>📅 <b>${esc(D.evento.fecha)}</b></div><div>📍 <b>${esc(D.evento.lugar)}</b></div><div>💶 Presupuesto: <b>${esc(D.evento.presupuesto)}</b></div></div></div>`;
  h += `<div class="card"><h2>💡 Sus gustos</h2>${!P.ideas.length&&!P.resumen.length?'<p class="nota">Todavía no ha contado nada. ¡Prueba a preguntarle! 👇</p>':''}
    ${P.ideas.length?'<div class="ideas">'+P.ideas.map(i=>'🎁 '+enlazar(i)).join('<br>')+'</div>':''}
    ${P.resumen.length?'<div class="res">'+P.resumen.map(r=>'<div><span>'+esc(r.q)+'</span><b>'+enlazar(r.a)+'</b></div>').join('')+'</div>':''}</div>`;
  if(D.preguntasActivas){
    h += `<div class="card" id="preg"><h2>💬 Pregúntale (anónimo)</h2>
      <p class="nota">${esc(D.amigo)} recibirá tu pregunta por correo sin saber quién eres, y su respuesta te llegará a ti.</p>
      <textarea id="tq" maxlength="600" placeholder="¿Qué talla usas? ¿Prefieres negro o blanco?"></textarea>
      <button class="btn" id="bq">Enviar pregunta</button>
      ${D.preguntas.length?'<div style="margin-top:12px"><b>Tus preguntas</b>'+D.preguntas.map(q=>'<div class="qa">“'+esc(q.texto)+'”'+(q.respuesta?'<div class="r">💌 '+esc(q.respuesta)+'</div>':'<div class="p">⏳ Esperando respuesta</div>')+'</div>').join('')+'</div>':''}
    </div>`;
  }
  const pend=(D.recibidas||[]).filter(q=>!q.respuesta);
  if((D.recibidas||[]).length){
    h += `<div class="card"><h2>🤫 Te han preguntado</h2><p class="nota">Preguntas de quien te regala a ti.</p>
      ${D.recibidas.map(q=>'<div class="qa">“'+esc(q.texto)+'”'+(q.respuesta?'<div class="r">Tu respuesta: '+esc(q.respuesta)+'</div>':'<textarea data-q="'+q.id+'" maxlength="600" placeholder="Tu respuesta" style="margin-top:8px;min-height:60px"></textarea><button class="btn sec" data-r="'+q.id+'">Responder</button>')+'</div>').join('')}</div>`;
  }
  h += `<div class="card" id="reg"><h2>🎁 ¿Qué le regalaste?</h2>
    <p class="nota">Después del reparto, apunta qué le regalaste a ${esc(D.amigo)}. Otro año, quien le toque lo sabrá para no repetirlo. No se guarda quién lo regaló.</p>
    <input id="tr" maxlength="300" value="${esc(D.regalo||'')}" placeholder="Un set de LEGO de coches">
    <button class="btn sec" id="br">${D.regalo?'Cambiar':'Guardar'}</button></div>`;
  app.innerHTML=h;
  if(M==='preguntar') setTimeout(()=>document.getElementById('preg')?.scrollIntoView({behavior:'smooth'}),300);
  if(M==='regalo') setTimeout(()=>{ document.getElementById('reg')?.scrollIntoView({behavior:'smooth'}); document.getElementById('tr')?.focus(); },300);
  const bq=document.getElementById('bq');
  if(bq) bq.onclick=async()=>{ const t=document.getElementById('tq').value.trim(); if(!t) return aviso('Escribe tu pregunta');
    bq.disabled=true; bq.textContent='Enviando…';
    try{ await llamar({accion:'preguntar',k:K,texto:t}); D.preguntas.push({texto:t,respuesta:''}); fiesta(); aviso('Pregunta enviada 🤫'); contenido(); document.getElementById('preg').scrollIntoView(); }
    catch(e){ bq.disabled=false; bq.textContent='Enviar pregunta'; aviso(e.message||'No se pudo enviar'); } };
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.r, t=document.querySelector('[data-q="'+id+'"]').value.trim(); if(!t) return aviso('Escribe tu respuesta');
    b.disabled=true; try{ await llamar({accion:'contestar',k:K,q:id,texto:t}); D.recibidas.find(q=>q.id===id).respuesta=t; aviso('Respuesta enviada 💌'); contenido(); }catch(e){ b.disabled=false; aviso(e.message||'No se pudo enviar'); } });
  const br=document.getElementById('br');
  br.onclick=async()=>{ const t=document.getElementById('tr').value.trim(); if(!t) return aviso('Escribe qué regalaste');
    br.disabled=true; try{ await llamar({accion:'regalo',k:K,que:t}); D.regalo=t; br.textContent='✓ Guardado'; fiesta(); setTimeout(()=>{br.disabled=false; br.textContent='Cambiar';},1500); }catch(e){ br.disabled=false; aviso(e.message||'No se pudo guardar'); } };
}

/* ---------- Responder una pregunta anónima ---------- */
function vistaResponder(){
  app.innerHTML = `<h1>🤫 Pregunta secreta</h1><p class="sub">${esc(D.sorteo)}</p>
    <div class="card"><p>¡Hola, <b>${esc(D.nombre)}</b>! Tu amigo invisible te pregunta:</p>
      <div class="qa" style="font-size:18px">“${esc(D.texto)}”</div>
      ${D.respuesta?'<p class="nota">Ya respondiste:</p><div class="qa r">'+esc(D.respuesta)+'</div><p class="nota">Puedes cambiar tu respuesta:</p>':''}
      <textarea id="ta" maxlength="600" placeholder="Tu respuesta">${esc(D.respuesta||'')}</textarea>
      <button class="btn" id="ba">Enviar respuesta</button>
      <p class="nota">Nadie sabrá quién te ha preguntado. Tampoco quien organiza.</p></div>`;
  const b=document.getElementById('ba');
  b.onclick=async()=>{ const t=document.getElementById('ta').value.trim(); if(!t) return aviso('Escribe tu respuesta');
    b.disabled=true; b.textContent='Enviando…';
    try{ await llamar({accion:'contestar',k:K,q:QID,texto:t}); fiesta(); app.innerHTML='<h1>💌 ¡Enviada!</h1><div class="card" style="text-align:center">Tu respuesta le ha llegado a tu amigo invisible. ¡Gracias!</div>'; }
    catch(e){ b.disabled=false; b.textContent='Enviar respuesta'; aviso(e.message||'No se pudo enviar'); } };
}

/* ---------- Animación: nieve, estrellas o confeti según el tema ---------- */
function fiesta(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.getElementById('fx'), x=c.getContext('2d'), dpr=devicePixelRatio||1;
  c.width=innerWidth*dpr; c.height=innerHeight*dpr; c.style.width=innerWidth+'px'; c.style.height=innerHeight+'px';
  const t=document.body.className||'navidad';
  const forma = t==='reyes' ? ['★','✦','✧'] : t==='cumple' ? null : ['✦','✧','★','❄'];
  const cols = t==='cumple' ? ['#e0457b','#2ec4b6','#ffe066','#ffffff','#7b6cf6'] : t==='reyes' ? ['#ffd666','#ffffff','#e9b44c'] : ['#e5c07b','#ffffff','#f3dfae'];
  const P=[]; for(let i=0;i<60;i++) P.push({x:Math.random()*c.width,y:-Math.random()*c.height*.6,s:(Math.random()*10+9)*dpr,vy:(Math.random()*1.6+1.2)*dpr,d:Math.random()*6.3,r:Math.random()*6.3,ch:forma?forma[i%forma.length]:null,col:cols[i%cols.length]});
  const t0=performance.now();
  (function f(now){ const el=(now-t0)/1000, a=el>4.5?Math.max(0,1-(el-4.5)/1.2):1; x.clearRect(0,0,c.width,c.height);
    for(const p of P){ p.y+=p.vy; p.d+=.03; p.x+=Math.sin(p.d)*dpr; p.r+=.03; x.save(); x.globalAlpha=a; x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.col;
      if(p.ch){ x.font=p.s+'px serif'; x.textAlign='center'; x.fillText(p.ch,0,0); } else x.fillRect(-p.s/3,-p.s/6,p.s/1.5,p.s/3); x.restore(); }
    if(a>0) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })(t0);
}
inicio();
</script>
</body>
</html>
